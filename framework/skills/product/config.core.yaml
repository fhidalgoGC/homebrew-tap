schema: framework-layer-core
schema_version: 4
layer: product
since: 2026-07-16
# v4 (2026-07-16): `agent` pasa a ser estructura con `options` + `default` + `reasoning`.
# v3 (2026-07-16): agrega `agent` (main | subagent) + `agent_reason` por step.
# v2 (2026-07-16): agrega `requires_complete` + `consumes` a step_matrix.

# ===========================================================================
# CONFIG.CORE — capa PRODUCTO
#
# Fuente de verdad ESTRUCTURAL — el usuario NO edita.
# - Toggle on/off → settings/config.yaml → parallelism.enabled.
# - Config operativa → docs/frmwk/skills/product/config.user.yaml.
# ===========================================================================

# ---------------------------------------------------------------------------
# STEP MATRIX — para cada step:
#   - requires_complete: DAG.
#   - consumes: insumos que lee.
#   - can_run_with: concurrentes.
#   - agent.options / agent.default / agent.reasoning:
#       Tipos ESTRUCTURALMENTE viables + recomendación del framework.
#       El user elige en config.user.yaml → step_agents.
#       Tipos: main | subagent | agent (ver header de story/config.core.yaml).
# ---------------------------------------------------------------------------
step_matrix:
  iniciativas:
    skill: /fremi-product-iniciativas
    requires_complete: []
    consumes:
      - "descripción libre del producto (input inicial del usuario)"
    can_run_with: []
    agent:
      options: [main]
      default: main
      reasoning:
        main: >
          Co-creación de hipótesis de negocio con el usuario. Las iniciativas
          SAFe reflejan la estrategia — deciden qué se construye y por qué.
          No delegable — el user tiene contexto que la IA no puede inferir.
    reason: >
      Raíz del discovery. Sin dependencia previa — sólo necesita la
      descripción inicial del producto.

  ideas:
    skill: /fremi-product-ideas
    requires_complete: [iniciativas]
    consumes:
      - "product/iniciativas.md — init-XXX Aceptadas para brainstorm de enfoques"
    can_run_with: []
    agent:
      options: [main, subagent, agent]
      default: subagent
      reasoning:
        subagent: >
          Brainstorm mecánico de enfoques por cada iniciativa. Sin decidir
          nada — sólo abre opciones. Subagentes en paralelo (uno por
          iniciativa).
        main: >
          Si el usuario quiere hacer el brainstorm en su thread principal
          para reaccionar a cada idea.
        agent: >
          Si hay un agente especializado en ideation / discovery.
    reason: >
      Sin iniciativas declaradas no hay contra qué proponer ideas.
      Regla 4 — discovery encadena secuencialmente.

  planteamiento:
    skill: /fremi-product-planteamiento
    requires_complete: [ideas]
    consumes:
      - "product/ideas.md — enfoques a evaluar y elegir approach"
      - "product/iniciativas.md — para conectar approach con hipótesis"
    can_run_with: [/fremi-product-adr]
    agent:
      options: [main]
      default: main
      reasoning:
        main: >
          Elección del approach entre múltiples opciones — decisión de
          negocio + potencial Regla 3b. El usuario decide entre caminos
          viables.
    reason: >
      El planteamiento elige el approach entre las ideas. Bifurcaciones en
      approach → ADR concurrente.

  definition:
    skill: /fremi-product-definition
    requires_complete: [planteamiento]
    consumes:
      - "product/planteamiento.md — approach elegido y framing del problema"
      - "product/iniciativas.md — capacidades que respaldan cada in-scope"
    can_run_with: [/fremi-product-adr]
    agent:
      options: [main]
      default: main
      reasoning:
        main: >
          Formalización del producto: in-scope, capacidades, usuarios,
          criterios de éxito medibles. Cascadea a TODAS las features —
          calidad de cada decisión pesa. Main obligatorio.
    reason: >
      Regla 4 — no se puede formalizar sin discovery cerrado.

  strategies:
    skill: /fremi-product-strategies
    requires_complete: [definition]
    consumes:
      - "product/definition.md — capacidades in-scope + NFRs para comparar"
    can_run_with: [/fremi-product-adr]
    agent:
      options: [main, subagent, agent]
      default: main
      reasoning:
        main: >
          Comparación de 2-3 estrategias técnicas + ELECCIÓN — Regla 3b
          típica. La elección del stack cascadea a todo el proyecto.
        subagent: >
          Análisis inicial de CADA estrategia (pros/contras aislados) puede
          hacerse en subagentes en paralelo. La ELECCIÓN final la hace el
          main con el usuario — nunca delegar la decisión.
        agent: >
          Si hay agente especializado en arquitectura / stack analysis.
    reason: >
      Sin definition no hay contra qué comparar.

  decisions:
    skill: /fremi-product-adr
    requires_complete: []
    consumes:
      - "contexto de la decisión (variable — puede venir de cualquier fase)"
    can_run_with: []
    single_writer: true
    agent:
      options: [main]
      default: main
      reasoning:
        main: >
          ADRs nacen de bifurcaciones Regla 3b — el usuario elige. La
          numeración ADR-XXX global es single-writer.
    reason: >
      ADRs son TRANSVERSALES — pueden aparecer en cualquier momento.

  plan:
    skill: /fremi-product-plan
    requires_complete: [definition, strategies]
    consumes:
      - "product/definition.md — capacidades in-scope para descomponer en features"
      - "product/strategies.md — estrategia elegida para priorizar features"
    can_run_with: []
    agent:
      options: [main]
      default: main
      reasoning:
        main: >
          Roadmap — priorización es decisión de negocio con el usuario.
          Además living doc single-writer (Regla 17 bumps).
    reason: >
      Requiere definition (qué producto) + strategies (con qué stack).

# ---------------------------------------------------------------------------
# INTERNAL ITEMS
# ---------------------------------------------------------------------------
internal_items:
  iniciativas:
    unit: init-XXX
    allow_parallel: true
    max_concurrent: 5
    merge_strategy: append-numbered
    reason: >
      Cada iniciativa SAFe es una hipótesis de negocio independiente.
    merge_hazards:
      - "Iniciativas con overlap semántico → consolidar en una sola pasada."

  ideas:
    unit: idea (bloque por iniciativa)
    allow_parallel: true
    max_concurrent: 5
    merge_strategy: group-by-initiative
    reason: >
      El brainstorm de enfoques por iniciativa es independiente entre
      iniciativas.

  strategies:
    unit: strategy (2-3 opciones técnicas)
    allow_parallel: true
    max_concurrent: 3
    merge_strategy: append-with-comparison
    reason: >
      Cada estrategia técnica es una opción independiente con pros/contras.
    merge_hazards:
      - "La ELECCIÓN entre estrategias es Regla 3b — no paralelizable, siempre pausa."

  decisions:
    unit: ADR-XXX
    allow_parallel: false
    reason: >
      ADRs se crean uno por uno cuando aparece la bifurcación (Regla 3b).
      Numeración global exige serialize.

  plan:
    unit: feature-entry
    allow_parallel: true
    max_concurrent: 5
    merge_strategy: append-ordered-by-priority
    reason: >
      Cada entry del roadmap (una feature) es una unidad independiente.
      Priorización (orden) es el paso serial al final.

# ---------------------------------------------------------------------------
# CROSS INSTANCE — producto es SINGLETON.
# ---------------------------------------------------------------------------
cross_instance:
  applies: false
  reason: >
    Producto es SINGLETON por proyecto — no hay múltiples productos.
    No aplica cross-instance parallelism.
