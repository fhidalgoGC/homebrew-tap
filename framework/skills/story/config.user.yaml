schema: framework-layer-user-config
schema_version: 5
layer: story
since: 2026-07-13

# ---------------------------------------------------------------------------
# Configuración USER-EDITABLE de la capa STORY.
# Vive junto al skill orquestador (~/.fremi/framework/framework/skills/story/) porque el
# usuario elige acá cómo trabajar. La ESTRUCTURA (topología, DAG, agent
# options) vive en config.core.yaml — user NO edita eso.
#
# Cadena de 11 docs FW-00..FW-10 (2 condicionales).
# ---------------------------------------------------------------------------

active: true

# ---------------------------------------------------------------------------
# Execution mode — override opcional del default global (config.yaml)
#
# - `default`: modo por default para skills de esta capa cuando el usuario
#   no pasa `--mode` en la invocación.
# - `pipeline_default`: modo por default cuando se invoca /fremi-pipeline-story.
#
# Comentar/omitir todo este bloque para heredar del master.
# ---------------------------------------------------------------------------
execution_mode:
  # Modo default para skills sueltos de esta capa (`/fremi-story-*`).
  # interactive → pausa DENTRO del skill validando cada sección con el usuario.
  # auto        → escribe el doc entero de un tirón.
  default: interactive

  # Modo default para el pipeline (`/fremi-pipeline-story`).
  # interactive → pausa ENTRE STEPS (los skills internos SIEMPRE corren en auto).
  # auto        → corre toda la cadena sin pausa (pausa sólo por stop events).
  pipeline_default: auto

  notes: >
    Stories tienen 9 docs obligatorios + 2 condicionales.

    - Skill suelto en `interactive`: la IA propone cada CA, cada SC, cada
      contrato SDD, cada elección de tech, cada TC, cada task-XXX antes de
      escribirlo — y espera OK.
    - Skill suelto en `auto`: llena el doc entero solo; pausa sólo ante
      Regla 3b, Regla 12, precondición ausente o info insuficiente.
    - Pipeline en `auto`: los 9 (o 11) docs se completan sin pausa entre
      steps y sin pausa dentro de cada step. Sólo se detiene por stop
      events reales.
    - Pipeline en `interactive`: los skills internos siguen escribiendo cada
      doc completo (auto), pero la IA se detiene ENTRE cada FW-XX terminado
      y pregunta si continúa al siguiente. Es el pipeline con checkpoints
      por doc — NUNCA reactiva el modo interactivo dentro de un sub-skill.

# ---------------------------------------------------------------------------
# Step agents — elección del tipo de agente por step.
#
# Cada step tiene sus opciones estructurales declaradas en
# `config.core.yaml → step_matrix.<step>.agent.options`. Acá el USUARIO
# elige uno de esos valores (main | subagent | agent). Si no se especifica
# un step, se usa `config.core.yaml → step_matrix.<step>.agent.default`.
#
# Validación (obligatoria antes de correr):
#   - El valor DEBE estar en `options` del core.
#   - Elegir un valor fuera de options → error, no se ejecuta el step.
#
# Todos los steps están listados abajo con su default del core; comentar
# la línea = usar el default. Descomentar y cambiar para overridear.
# ---------------------------------------------------------------------------
step_agents:
  # FW-00_explore: subagent          # core options: [main, subagent, agent]
  # FW-01_definition: main           # core options: [main]                  (no overridable)
  # FW-02_proposal: main             # core options: [main]                  (no overridable)
  # FW-03_scope: main                # core options: [main]                  (no overridable)
  # FW-04_bdd: subagent              # core options: [main, subagent, agent]
  # FW-05_sdd: main                  # core options: [main, subagent, agent]
  # FW-06_design: main               # core options: [main]                  (no overridable)
  # FW-07_tdd: subagent              # core options: [main, subagent, agent]
  # FW-08_plan: main                 # core options: [main, subagent]
  # FW-09_checkwork: main            # core options: [main]                  (no overridable)
  # apply: subagent                  # core options: [main, subagent, agent]
  # verify: subagent                 # core options: [main, subagent, agent]
  # closure-check: subagent          # core options: [main, subagent, agent]
  # FW-10_closure: main              # core options: [main]                  (no overridable)

# ---------------------------------------------------------------------------
# Docs de la capa
# ---------------------------------------------------------------------------
docs:
  - name: explore
    file: FW-00_explore.md
    required: conditional
    condition_ref: explore_when
    doc_type: snapshot
    skill: /fremi-story-explore
    phase: explore

  - name: definition
    file: FW-01_definition.md
    required: always
    doc_type: snapshot
    skill: /fremi-story-definition
    phase: definition

  - name: proposal
    file: FW-02_proposal.md
    required: conditional
    condition_ref: proposal_when
    doc_type: snapshot
    skill: /fremi-story-proposal
    phase: proposal

  - name: scope
    file: FW-03_scope.md
    required: always
    doc_type: snapshot
    skill: /fremi-story-scope
    phase: scope

  - name: bdd-userstories
    file: FW-04_bdd-userstories.md
    required: always
    doc_type: snapshot
    skill: /fremi-story-bdd
    phase: bdd

  - name: sdd-spec
    file: FW-05_sdd-spec.md
    required: always
    doc_type: snapshot
    skill: /fremi-story-sdd
    phase: sdd

  - name: design
    file: FW-06_design.md
    required: always
    doc_type: snapshot
    skill: /fremi-story-design
    phase: design

  - name: tdd-plan
    file: FW-07_tdd-plan.md
    required: always
    doc_type: snapshot
    skill: /fremi-story-tdd
    phase: tdd

  - name: plan
    file: FW-08_plan.md
    required: always
    doc_type: snapshot
    skill: /fremi-story-plan
    phase: tasks

  - name: checkwork
    file: FW-09_checkwork.md
    required: always
    doc_type: living
    lifecycle: live
    skill: /fremi-story-checkwork
    phase: apply

  - name: closure
    file: FW-10_closure.md
    required: always
    doc_type: snapshot
    skill: /fremi-story-closure
    phase: closure

# Fase verify — no tiene doc dedicado; su reporte va dentro de checkwork
verify_phase:
  dedicated_doc: false
  phase: verify
  skill: /fremi-story-verify
  writes_to: FW-09_checkwork.md (sección "Última corrida de verify")

# ---------------------------------------------------------------------------
# Reglas condicionales locales
# ---------------------------------------------------------------------------
conditional_rules:
  explore_when:
    description: >
      `explore` es OBLIGATORIO cuando aplica al menos UNA de las siguientes;
      opcional en el resto de los casos.
    obligatory_if_any:
      - "La story toca un área del codebase que el implementador no conoce."
      - "Existen 2+ approaches técnicos plausibles que ameritan comparar antes de proponer."
      - "La story integra con una librería/servicio externo no usado antes en el proyecto."
      - "La story es de migración o reemplazo (ej: cambiar de X a Y)."
    optional_default: >
      Bug fixes chicos, cambios triviales de configuración, refactors
      locales sin cambio de comportamiento — el explore no aporta.
    empty_placeholder_allowed: true

  proposal_when:
    description: >
      `proposal` es OBLIGATORIO cuando aplica al menos UNA de las siguientes;
      opcional en el resto de los casos.
    obligatory_if_any:
      - "La story introduce un contrato externo nuevo (endpoint, evento, comando público)."
      - "La story tiene una bifurcación técnica que dispara Regla 3b."
      - "La story afecta 3+ archivos no triviales o cruza módulos."
      - "La story cambia comportamiento visible al usuario final."
      - "La story tiene riesgo de rollback (migración de datos, API break, etc.)."
    optional_default: >
      Bug fixes locales sin cambio de contrato, cambios de wording,
      ajustes de configuración interna.
    empty_placeholder_allowed: true

# ---------------------------------------------------------------------------
# FLOW — secuencia canónica de la story
# ---------------------------------------------------------------------------
flow:
  sequence:
    - step: 0
      skill: /fremi-story-explore
      condition: "config.story.conditional_rules.explore_when aplica"
      preconditions:
        - "feature/definition.md existe con contenido"
      produces: FW-00_explore.md
      versioning: snapshot con ancestor.version_at_creation = feature/definition@version

    - step: 1
      skill: /fremi-story-definition
      preconditions:
        - "feature/definition.md existe"
      produces: FW-01_definition.md

    - step: 2
      skill: /fremi-story-proposal
      condition: "config.story.conditional_rules.proposal_when aplica"
      preconditions:
        - "FW-01_definition.md completo (con CAs)"
      produces: FW-02_proposal.md

    - step: 3
      skill: /fremi-story-scope
      preconditions:
        - "FW-01_definition.md completo"
      produces: FW-03_scope.md

    - step: 4
      skill: /fremi-story-bdd
      preconditions:
        - "FW-01 + FW-03 completos"
      produces: FW-04_bdd-userstories.md

    - step: 5
      skill: /fremi-story-sdd
      preconditions:
        - "FW-04 con SC-XXX (happy + borde)"
      produces: FW-05_sdd-spec.md

    - step: 6
      skill: /fremi-story-design
      preconditions:
        - "FW-05 con contratos completos"
      produces: FW-06_design.md

    - step: 7
      skill: /fremi-story-tdd
      preconditions:
        - "FW-06 completo, Open Questions cerradas"
      produces: FW-07_tdd-plan.md

    - step: 8
      skill: /fremi-story-plan
      preconditions:
        - "FW-07 con TCs mapeados"
      produces: FW-08_plan.md

    - step: 9
      skill: /fremi-story-checkwork
      preconditions:
        - "FW-08 con al menos 1 task"
      produces: FW-09_checkwork.md (living durante implementación)

    # Iteración: /fremi-story-task agrega tasks a FW-08 + /fremi-story-checkwork las mueve durante implementación

    - step: 10
      skill: /fremi-story-verify
      preconditions:
        - "FW-09_checkwork.md en 100%"
      writes_to: FW-09_checkwork.md (sección verify)

    - step: 11
      skill: /fremi-story-closure-check
      preconditions:
        - "/fremi-story-verify PASS o PASS WITH WARNINGS"
      produces: reporte de gaps antes del sign-off

    - step: 12
      skill: /fremi-story-closure
      preconditions:
        - "/fremi-story-closure-check sin CRITICAL"
      produces: FW-10_closure.md firmado
      side_effects:
        - "Bumpea la feature padre según parent_bump_triggers.story_closes (Regla 17)"

  # NOTA: la TOPOLOGÍA de paralelismo (qué steps pueden concurrir, qué items
  # internos son paralelizables, qué instancias pueden convivir) vive en
  # `~/.fremi/framework/framework/skills/story/config.core.yaml` — es estructura del framework,
  # no configuración de usuario. Este archivo (settings) sólo tiene el flag
  # on/off de paralelismo (ver config.yaml master → parallelism.enabled).

  # Transversales — durante toda la story
  parallel_allowed:
    - skill: /fremi-story-task
      when: "agregar/refinar task-XXX en FW-08"
      writes_to: FW-08_plan.md
      side_effects: ["Bumpea PATCH del FW-08"]

    - skill: /fremi-story-checkwork
      when: "arrancar/cerrar task-XXX o refrescar estado"
      writes_to: FW-09_checkwork.md
      side_effects: ["Bumpea PATCH/MINOR del FW-09 (living)"]

    - skill: /fremi-story-adr
      when: "aparece decisión técnica local a la story (Regla 3b)"
      produces: entries en HU-YY/decisions.md (delta que se merge al FT-XX al cerrar)

    - skill: /fremi-story-bug
      when: "bug local descubierto durante la story"
      produces: HU-YY/bugs/BG-XX_<slug>.md

    - skill: /fremi-enabler --story FT-XX/HU-YY
      when: "trabajo técnico habilitador local a la story"
      produces: HU-YY/enablers/EN-XX_<slug>/

# ---------------------------------------------------------------------------
# Referencias cruzadas
# ---------------------------------------------------------------------------
references:
  master_config: ~/.fremi/framework/framework/settings/config.yaml
  methodology: ~/.fremi/framework/framework/settings/methodology.json
  rules: ~/.fremi/framework/framework/rules/workflow.md
  orchestrator_skill: /fremi-story
