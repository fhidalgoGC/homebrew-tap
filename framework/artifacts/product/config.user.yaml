schema: framework-layer-user-config
schema_version: 6
layer: product
since: 2026-08-10
# v6 (2026-08-10): la SECUENCIA canónica se movió a workflow.yaml (fuente única).
#                  Este archivo queda con SÓLO user choices: active, execution_mode,
#                  step_agents (elección de agente por step), conditional_rules.
# v5 (2026-07-13): esquema previo consolidando docs[], flow.sequence[], etc.

# ===========================================================================
# CONFIG.USER — capa PRODUCT
#
# ÚNICO archivo user-editable de esta capa. Cambiá acá para adaptar la
# ejecución del workflow a tu proyecto sin tocar la estructura del framework.
#
# ---------------------------------------------------------------------------
# UBICACIÓN Y RESOLUCIÓN EN RUNTIME (importante)
#
# Este archivo dentro del framework
# (`~/.fremi/framework/artifacts/product/config.user.yaml`) es un TEMPLATE.
# Al correr `fremi install` en un proyecto, se copia a:
#     <project>/.fremi/settings/product/config.user.yaml
#
# El orquestador resuelve así en runtime:
#   1. Lee `<project>/.fremi/settings/product/config.user.yaml` (versión del proyecto).
#   2. Si no existe → fallback a `~/.fremi/framework/artifacts/product/config.user.yaml` (este template).
#
# Editar este archivo del framework cambia el DEFAULT que reciben proyectos
# NUEVOS al instalar. Proyectos ya instalados usan su propio copy en
# `.fremi/settings/product/`.
# ---------------------------------------------------------------------------
#
# Este archivo NO contiene:
#   - la secuencia canónica del workflow → `workflow.yaml`
#   - las agent options estructuralmente válidas → `config.core.yaml`
#   - las reglas globales aplicables → `rules/applies.yaml`
# ===========================================================================

active: true

# ---------------------------------------------------------------------------
# Execution mode — override opcional del default global (settings/config.core.yaml)
#
# - `default`: modo por default para skills sueltos de esta capa cuando el
#   usuario no pasa `--mode` en la invocación.
# - `pipeline_default`: modo por default cuando se invoca /fremi-pipeline-product.
#
# Comentar/omitir todo este bloque para heredar del master.
# ---------------------------------------------------------------------------
execution_mode:
  # Modo default para skills sueltos de esta capa (`/fremi-product-*`).
  # interactive → pausa DENTRO del skill validando cada sección con el usuario.
  # auto        → escribe el doc entero de un tirón.
  default: interactive

  # Modo default para el pipeline (`/fremi-pipeline-product`).
  # interactive → pausa ENTRE STEPS (los skills internos SIEMPRE corren en auto).
  # auto        → corre toda la cadena sin pausa (pausa sólo por stop events).
  pipeline_default: auto

  notes: >
    Producto tiene 7 docs (3 discovery + 4 formalización), todos living.
    Es la capa donde MÁS conviene interactivo por default a nivel skill suelto,
    porque las decisiones acá cascadean a todas las features.

    - Skill suelto en `interactive`: la IA propone cada iniciativa, cada idea,
      cada capacidad in-scope, cada estrategia técnica y valida con el usuario
      antes de escribirla.
    - Skill suelto en `auto`: llena el doc entero solo; pausa sólo ante
      Regla 3b (elección de stack / approach con trade-offs no-triviales)
      o info inicial insuficiente para formular al menos una iniciativa.
    - Pipeline en `auto`: los 7 docs se completan sin pausa entre steps y
      sin pausa dentro de cada step. Sólo se detiene por stop events reales.
    - Pipeline en `interactive`: los skills internos siguen escribiendo cada
      doc completo (auto), pero la IA se detiene ENTRE cada doc terminado
      (iniciativas → OK? → ideas → OK? → …) y pregunta si continúa. Los
      skills internos NUNCA reactivan el modo interactivo.

# ---------------------------------------------------------------------------
# Step agents — elección del tipo de agente por step.
#
# Cada valor debe estar en `config.core.yaml → agent_matrix[<step>].options`.
# Si el usuario elige un valor fuera de las opciones válidas → error de
# configuración (el step no se ejecuta hasta corregirlo).
#
# Los steps sin entry acá heredan `agent_matrix[<step>].default` del core.
#
# Tipos: main | subagent | agent (ver `config.core.yaml` header para detalle).
# ---------------------------------------------------------------------------
step_agents:
  iniciativas: main            # options: [main]                  (no overridable)
  ideas: subagent              # options: [main, subagent, agent]
  planteamiento: main          # options: [main]                  (no overridable)
  definition: main             # options: [main]                  (no overridable)
  strategies: main             # options: [main, subagent, agent]
  decisions: main              # options: [main]                  (no overridable, single-writer)
  plan: main                   # options: [main]                  (no overridable, single-writer)

# ---------------------------------------------------------------------------
# Reglas condicionales locales — product no tiene steps condicionales.
#
# A diferencia de story (que tiene `explore` y `proposal` como condicionales),
# todos los 7 docs de product son ALWAYS required. El discovery (iniciativas,
# ideas, planteamiento) es obligatorio antes de formalización (definition,
# strategies, decisions, plan) — eso está gobernado por el DAG en workflow.yaml,
# no por conditional_rules aquí.
#
# Si en el futuro se introduce un step condicional de product, agregar acá
# la regla con el mismo formato que usa story/config.user.yaml.
# ---------------------------------------------------------------------------
conditional_rules: {}

# ---------------------------------------------------------------------------
# Referencias cruzadas
#
# `self` incluye ambas ubicaciones para explicitar dónde termina el archivo
# post-install y dónde vive el template.
# ---------------------------------------------------------------------------
references:
  self:
    runtime: .fremi/settings/product/config.user.yaml               # PROYECTO (donde se lee en runtime)
    framework_template: ~/.fremi/framework/artifacts/product/config.user.yaml  # ESTE archivo (template)
  workflow: ~/.fremi/framework/artifacts/product/workflow.yaml
  agent_matrix: ~/.fremi/framework/artifacts/product/config.core.yaml
  applied_rules: ~/.fremi/framework/artifacts/product/rules/applies.yaml
  master_config: ~/.fremi/framework/settings/config.core.yaml
  methodology: ~/.fremi/framework/settings/methodology.core.yaml
  rules_index: ~/.fremi/framework/rules/workflow.md
  orchestrator_skill: /fremi-product
