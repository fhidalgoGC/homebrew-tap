schema: framework-layer-core
schema_version: 5
layer: extra
since: 2026-08-10
# v5 (2026-08-10): la SECUENCIA canónica se movió a workflow.yaml (fuente única).
#                  Este archivo queda con SÓLO agent_matrix + parallelism topology.
# v1 (2026-07-13): esquema original monolítico (step_matrix + sections + flow + procedure_manual).

# ===========================================================================
# CONFIG.CORE — capa EXTRA
#
# Fuente de verdad ESTRUCTURAL — el usuario NO edita este archivo.
# Sólo el mantenedor del framework lo cambia cuando la topología de
# ejecución muta.
#
# Este archivo NO contiene la SECUENCIA del workflow — eso vive en
# workflow.yaml. Acá sólo:
#   - agent_matrix: qué agentes pueden ejecutar el step `scaffold`
#   - internal_items: extra NO tiene paralelismo intra-step (vacío)
#   - cross_instance: múltiples archivos extra conviven sin conflicto
#
# - Toggle on/off del paralelismo → `~/.fremi/framework/settings/config.core.yaml → parallelism.enabled`.
# - Elección concreta de agent por step → `config.user.yaml → step_agents`.
# - Steps enumerados acá deben existir en `workflow.yaml` con el mismo `id`.
# ===========================================================================

# ---------------------------------------------------------------------------
# AGENT MATRIX — para el único step del workflow de extra.
#
# Tipos:
#   - main     → el agente principal (thread del usuario). Necesario ante
#                decisiones de negocio, bifurcaciones Regla 3b, o
#                co-creación con el usuario.
#   - subagent → subagente aislado spawneado vía Task tool (context propio,
#                retorna al main). Ideal para trabajo auto-contenido:
#                scaffolding mecánico sin interacción.
#   - agent    → agente ESPECIALIZADO con system prompt de dominio + tools
#                acotados.
#
# Sólo los tipos listados en `options` son elegibles. El usuario elige uno en
# `config.user.yaml → step_agents`; si no lo elige, se usa `default`.
#
# Regla dura: subagentes y agentes NUNCA interactúan con el usuario. Si
# `execution_mode: interactive`, el main pausa al retornar el subagente/agente
# para que el usuario valide antes de continuar.
# ---------------------------------------------------------------------------
agent_matrix:

  scaffold:
    options: [main]
    default: main
    reasoning:
      main: >
        El scaffold de un archivo extra SIEMPRE requiere confirmar con el
        usuario que el trabajo no es spec-driven (Regla 14 — pregunta
        explícita de clasificación). Un subagente aislado no puede resolver
        esa confirmación interactiva. Además, el nombre (slug) suele
        negociarse con el usuario. El paso es rápido y no requiere fan-out.

# ---------------------------------------------------------------------------
# INTERNAL ITEMS — paralelismo INTRA-step.
#
# Extra NO tiene items paralelos dentro del step `scaffold`.
# Cada archivo extra es una unidad cohesiva y atómica — "un concepto,
# un archivo" (Regla 14).
# ---------------------------------------------------------------------------
internal_items: {}

# ---------------------------------------------------------------------------
# CROSS INSTANCE — paralelismo INTER-archivo extra.
#
# Múltiples archivos extra pueden existir independientemente sin conflicto.
# Cada archivo extra es autónomo: no comparte estado con otros archivos extra.
# La ÚNICA condición de serialize es la asignación del número secuencial de
# archivo (para evitar colisiones de identificador).
# ---------------------------------------------------------------------------
cross_instance:

  same_project:
    allow_parallel_creation: false           # serialize al asignar número
    allow_parallel_editing: true             # edición de archivos distintos: OK en paralelo
    conditions:
      - "La asignación del número de archivo es serial (un número a la vez)."
      - "Archivos extra distintos no comparten contenido."
    merge_hazards:
      - >
        Creación simultánea de dos archivos extra → race en la asignación
        del número. Serialize la invocación del skill scaffold.
    reason: >
      Los archivos extra son independientes entre sí. Pueden editarse en
      paralelo sin problema. Sólo el scaffold (cálculo + asignación del
      número) debe serializarse para evitar colisiones.

# ---------------------------------------------------------------------------
# Referencias cruzadas
#
# `config.user.yaml` es user-editable: runtime lee del PROYECTO
# (`.fremi/settings/<capa>/config.user.yaml`). Si no existe, fallback al
# TEMPLATE del framework. Los demás archivos viven SÓLO en el framework.
# ---------------------------------------------------------------------------
references:
  workflow: ~/.fremi/framework/artifacts/extra/workflow.yaml
  user_choices:
    runtime: .fremi/settings/extra/config.user.yaml               # PROYECTO (preferido en runtime)
    framework_template: ~/.fremi/framework/artifacts/extra/config.user.yaml  # FALLBACK / template inicial
  applied_rules: ~/.fremi/framework/artifacts/extra/rules/applies.yaml
  master_config: ~/.fremi/framework/settings/config.core.yaml
