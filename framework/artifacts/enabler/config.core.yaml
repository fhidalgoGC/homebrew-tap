schema: framework-layer-core
schema_version: 4
layer: enabler
since: 2026-07-16
# v4 (2026-07-16): `agent` pasa a ser estructura con `options` + `default` + `reasoning`.
# v3 (2026-07-16): agrega `agent` (main | subagent) + `agent_reason` por step.
# v2 (2026-07-16): agrega `requires_complete` + `consumes` a step_matrix.

# ===========================================================================
# CONFIG.CORE — capa ENABLER
#
# Fuente de verdad ESTRUCTURAL — el usuario NO edita.
# - Toggle on/off → settings/config.core.yaml → parallelism.enabled.
# - Config operativa → ~/.fremi/framework/artifacts/enabler/config.user.yaml.
# ===========================================================================

# ---------------------------------------------------------------------------
# STEP MATRIX — cadena de 4 docs.
# Ejes: requires_complete, consumes, can_run_with, agent{options/default/reasoning}.
# Tipos de agent: main | subagent | agent (ver header de story/config.core.yaml).
# ---------------------------------------------------------------------------
step_matrix:
  {enabler.definition}:
    skill: /fremi-enabler-definition
    requires_complete:
      - "padre existe según scope (product/definition.md OR feature/definition.md OR story/{workflow.definition})"
    consumes:
      - "padre (según scope) — para vincular qué features/stories dependen"
    can_run_with: []
    agent:
      options: [main]
      default: main
      reasoning:
        main: >
          Definir qué habilita el enabler y a quién sirve — decisión técnico-
          estratégica que requiere validación humana. Los criterios de
          aceptación técnicos deben ser negociados con el usuario.
    reason: >
      Primer doc de la cadena. Requiere el padre según scope declarado
      (--global / --feature / --story).

  {enabler.design}:
    skill: /fremi-enabler-design
    requires_complete: [{enabler.definition}]
    consumes:
      - "{enabler.definition} — qué habilita, criterios técnicos"
      - "product/decisions.md — ADRs globales que restringen tech"
      - "product/strategies.md — stack global aplicable"
    can_run_with:
      - /fremi-product-adr
      - /fremi-feature-adr
      - /fremi-story-adr
    agent:
      options: [main, subagent, agent]
      default: main
      reasoning:
        main: >
          Design del enabler es la capa con más bifurcaciones técnicas
          (Regla 3b). Elecciones cascadean al proyecto. Main obligatorio
          para pausar y decidir con el usuario.
        subagent: >
          Análisis de decisiones técnicas individuales (una librería, un
          pattern, una config de infra) PUEDEN hacerse en subagentes en
          paralelo (ver internal_items.{enabler.design}). La consolidación final
          y las bifurcaciones las hace el main.
        agent: >
          Si hay agente especializado en infra design / arquitectura.
    reason: >
      Sin definition no hay contra qué diseñar.

  {enabler.plan}:
    skill: /fremi-enabler-plan
    requires_complete: [{enabler.design}]
    consumes:
      - "{enabler.design} — decisiones técnicas para descomponer en tasks"
    can_run_with: []
    agent:
      options: [main, subagent]
      default: main
      reasoning:
        main: >
          Descomposición requiere juicio: orden, granularidad, criterios
          verificables (Regla 7b) + declaración de depends_on para el DAG.
        subagent: >
          Si el usuario acepta que el sub proponga una descomposición
          inicial y el main revise/priorice.
    reason: >
      Sin design (elección de tech + estructura) no hay unidad de trabajo.

  # Fase apply del enabler
  apply:
    phase: apply
    requires_complete: [{enabler.plan}]
    consumes:
      - "{enabler.plan} — cola de tasks a ejecutar"
      - "{enabler.design} — decisiones para implementar cada task"
    can_run_with:
      - "any-scope ADR skill"
    agent:
      options: [main, subagent, agent]
      default: subagent
      reasoning:
        subagent: >
          Cada task del enabler es unidad aislada (crear layer, config
          de infra, script). Un subagente por task encaja perfecto.
          El main coordina + serializa checkwork.
        main: >
          Si el usuario prefiere ejecutar cada task en su thread principal.
        agent: >
          Si hay agente especializado en infra-apply / IaC.
    reason: >
      Sin plan no hay tasks para ejecutar.

  {enabler.closure}:
    skill: /fremi-enabler-closure
    requires_complete:
      - "todas las tasks de EN-03 en [x]"
      - "criterios técnicos de EN-01 verificados"
    consumes:
      - "{enabler.plan} — verifica que todas las tasks estén cerradas"
      - "{enabler.definition} — criterios de aceptación técnicos a verificar"
      - "padre (según scope) — versión actual para bumpear (Regla 17)"
    can_run_with: []
    agent:
      options: [main]
      default: main
      reasoning:
        main: >
          Firma final + bump del padre (Regla 17). Escritura sobre docs
          compartidos con el padre (single-writer).
    reason: >
      Precondiciones duras: 100% tasks + criterios técnicos cumplidos.

# ---------------------------------------------------------------------------
# INTERNAL ITEMS
# ---------------------------------------------------------------------------
internal_items:
  {enabler.design}:
    unit: technical-decision
    allow_parallel: true
    max_concurrent: 3
    merge_strategy: append-per-section
    reason: >
      Decisiones técnicas independientes (librería A + config infra B +
      pattern C) pueden analizarse en paralelo.
    merge_hazards:
      - "Elecciones que se afectan mutuamente (stack + librería + tooling) — resolver en pasada única."
      - "Bifurcaciones Regla 3b siempre pausan — no paralelizable."

  {enabler.plan}:
    unit: task-XXX (T-XXX del enabler)
    allow_parallel: false
    allow_parallel_when: >
      Como en story — CREACIÓN secuencial (orden importa), EJECUCIÓN puede
      paralelizar tasks sin dependencias.
    reason: >
      Tasks del enabler suelen tener dependencias fuertes (crear layer →
      desplegar → validar). Sin `depends_on` explícito, default secuencial.

  apply:
    unit: task-XXX
    allow_parallel: true
    max_concurrent: 2
    conditions:
      - "Tasks declaran `depends_on: []` o lista explícita."
      - "Tasks paralelas NO tocan la misma infra/config compartida."
    reason: >
      Tasks de tooling/config independientes (ej: dos layers distintos)
      pueden ejecutarse en paralelo por subagentes.

# ---------------------------------------------------------------------------
# CROSS INSTANCE — entre múltiples enablers.
# ---------------------------------------------------------------------------
cross_instance:
  any_scope:
    allow_parallel_creation: true
    allow_parallel_lifecycle: true
    conditions:
      - "Enablers NO comparten infraestructura crítica en construcción."
      - "Numeración EN-XX global se serializa al asignar ID."
    reason: >
      Enablers en distintos scopes (global + feature) son independientes.
      Enablers en el mismo scope pueden solaparse si no comparten dependencias.
