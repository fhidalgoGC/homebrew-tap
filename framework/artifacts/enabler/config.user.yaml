schema: framework-layer-user-config
schema_version: 4
layer: enabler
since: 2026-07-13

# ---------------------------------------------------------------------------
# Configuración USER-EDITABLE de la capa ENABLER.
# Vive junto al skill orquestador (~/.fremi/framework/artifacts/enabler/) porque el
# usuario elige acá cómo trabajar. La ESTRUCTURA vive en config.core.yaml.
#
# 4 docs livianos: definition → design → plan → closure.
# Puede vivir en 3 scopes: global / feature / story.
# ---------------------------------------------------------------------------

active: true

# ---------------------------------------------------------------------------
# Step agents — elección del tipo de agente por step.
#
# Snapshot de los defaults del core (framework/artifacts/enabler/config.core.yaml).
# Editable — cambiá cualquier valor a uno de los declarados en `# core options`.
# Elegir un tipo fuera de las opciones válidas es un error de configuración.
#
# Tipos: main | subagent | agent (ver header de story/config.core.yaml).
# ---------------------------------------------------------------------------
step_agents:
  {enabler.definition}: main       # core options: [main]                  (no overridable)
  {enabler.design}: main           # core options: [main, subagent, agent]
  {enabler.plan}: main             # core options: [main, subagent]
  apply: subagent              # core options: [main, subagent, agent]
  {enabler.closure}: main          # core options: [main]                  (no overridable)

# ---------------------------------------------------------------------------
# Docs de la capa (4 docs, todos snapshot)
# ---------------------------------------------------------------------------
docs:
  - name: definition
    file: {enabler.definition}
    required: always
    doc_type: snapshot
    skill: /fremi-enabler
    phase: definition

  - name: design
    file: {enabler.design}
    required: always
    doc_type: snapshot
    skill: /fremi-enabler
    phase: design

  - name: plan
    file: {enabler.plan}
    required: always
    doc_type: snapshot
    skill: /fremi-enabler
    phase: tasks

  - name: closure
    file: {enabler.closure}
    required: always
    doc_type: snapshot
    skill: /fremi-enabler
    phase: closure

# ---------------------------------------------------------------------------
# Scopes admitidos
# ---------------------------------------------------------------------------
scopes:
  global:
    location: docs/works/enablers/{en_folder}/
    invocation: "/fremi-enabler <nombre>"
    when: "Enabler transversal — no pertenece a una sola feature/story"

  feature:
    location: docs/works/features/{feature_folder}/enablers/{en_folder}/
    invocation: "/fremi-enabler <nombre> --feature FT-XX"
    when: "Enabler local a UNA feature"

  story:
    location: docs/works/features/{feature_folder}/user-stories/{story_folder}/enablers/{en_folder}/
    invocation: "/fremi-enabler <nombre> --story FT-XX/HU-YY"
    when: "Enabler local a UNA story"

# Numeración EN-XX global al proyecto (evita colisiones entre scopes).
numbering: global

conditional_rules: {}

# ---------------------------------------------------------------------------
# FLOW — secuencia canónica del enabler. Cada step es un skill invocable.
# ---------------------------------------------------------------------------
flow:
  sequence:
    - step: 1
      skill: /fremi-enabler
      action: create-scaffold
      preconditions:
        - "Padre existe según scope (product / feature / story)"
      produces:
        - {enabler.definition} (esqueleto)
        - {enabler.design} (esqueleto)
        - {enabler.plan} (esqueleto)
        - {enabler.closure} (esqueleto)

    - step: 2
      skill: /fremi-enabler-definition
      preconditions:
        - "scaffold del enabler creado"
      produces: {enabler.definition} poblado

    - step: 3
      skill: /fremi-enabler-design
      preconditions:
        - "{enabler.definition} con contenido real"
      produces: {enabler.design} poblado
      side_effects: ["ADRs generados si hubo bifurcaciones (Regla 3b)"]

    - step: 4
      skill: /fremi-enabler-plan
      preconditions:
        - "{enabler.design} con estructura de archivos"
      produces: {enabler.plan} con task-XXX

    - step: 5
      skill: /fremi-enabler-closure
      preconditions:
        - "Todas las tasks de EN-03 en [x]"
        - "Criterios técnicos de EN-01 verificados"
      produces: {enabler.closure} firmado
      side_effects:
        - "Bumpea el padre según parent_bump_triggers.enabler_closes (Regla 17)"

  # NOTA: la TOPOLOGÍA de paralelismo vive en
  # `~/.fremi/framework/artifacts/enabler/config.core.yaml` — es estructura del framework,
  # no configuración de usuario. Este archivo (settings) sólo tiene el flag
  # on/off (ver config.yaml master → parallelism.enabled).

  parallel_allowed:
    - skill: /fremi-product-adr / /fremi-feature-adr / /fremi-story-adr
      when: "aparece decisión técnica en EN-02 (Regla 3b)"
      scope_of_adr: "según scope del enabler"

# ---------------------------------------------------------------------------
# Referencias cruzadas
# ---------------------------------------------------------------------------
references:
  master_config: ~/.fremi/framework/settings/config.core.yaml
  methodology: ~/.fremi/framework/settings/methodology.core.yaml
  rules: ~/.fremi/framework/rules/workflow.md
  orchestrator_skill: /fremi-enabler
