schema: framework-layer-user-config
schema_version: 6
layer: enabler
since: 2026-08-10
# v6 (2026-08-10): la SECUENCIA canónica se movió a workflow.yaml (fuente única).
#                  Este archivo queda con SÓLO user choices: active, execution_mode,
#                  step_agents (elección de agente por step), conditional_rules.
# v5 (2026-07-13): esquema previo con docs[], flow.sequence[], scopes[], numbering, references.

# ===========================================================================
# CONFIG.USER — capa ENABLER
#
# ÚNICO archivo user-editable de esta capa. Cambiá acá para adaptar la
# ejecución del workflow a tu proyecto sin tocar la estructura del framework.
#
# ---------------------------------------------------------------------------
# UBICACIÓN Y RESOLUCIÓN EN RUNTIME (importante)
#
# Este archivo dentro del framework
# (`~/.fremi/framework/artifacts/enabler/config.user.yaml`) es un TEMPLATE.
# Al correr `fremi install` en un proyecto, se copia a:
#     <project>/.fremi/settings/enabler/config.user.yaml
#
# El orquestador resuelve así en runtime:
#   1. Lee `<project>/.fremi/settings/enabler/config.user.yaml` (versión del proyecto).
#   2. Si no existe → fallback a `~/.fremi/framework/artifacts/enabler/config.user.yaml` (este template).
#
# Editar este archivo del framework cambia el DEFAULT que reciben proyectos
# NUEVOS al instalar. Proyectos ya instalados usan su propio copy en
# `.fremi/settings/enabler/`.
# ---------------------------------------------------------------------------
#
# Este archivo NO contiene:
#   - la secuencia canónica del workflow → `workflow.yaml`
#   - las agent options estructuralmente válidas → `config.core.yaml`
#   - las reglas globales aplicables → `rules/applies.yaml`
# ===========================================================================

active: true

# ---------------------------------------------------------------------------
# Execution mode — override opcional del default global (settings/config.core.yaml)
#
# - `default`: modo por default para skills sueltos de esta capa cuando el
#   usuario no pasa `--mode` en la invocación.
# - `pipeline_default`: modo por default cuando se invoca /fremi-pipeline-enabler.
#
# Comentar/omitir todo este bloque para heredar del master.
# ---------------------------------------------------------------------------
execution_mode:
  # Modo default para skills sueltos de esta capa (`/fremi-enabler-*`).
  # interactive → pausa DENTRO del skill validando cada sección con el usuario.
  # auto        → escribe el doc entero de un tirón.
  default: interactive

  # Modo default para el pipeline (`/fremi-pipeline-enabler`).
  # interactive → pausa ENTRE STEPS (los skills internos SIEMPRE corren en auto).
  # auto        → corre toda la cadena sin pausa (pausa sólo por stop events).
  pipeline_default: auto

  notes: >
    Enabler tiene 4 docs (cadena liviana): definition → design → plan → closure.
    Todos son snapshot; el apply es fase de ejecución sin doc dedicado.

    - Skill suelto en `interactive`: la IA propone cada criterio técnico, cada
      elección de librería/stack, cada task con su DoD, antes de escribirlos
      — y espera OK del usuario.
    - Skill suelto en `auto`: llena el doc entero solo; pausa sólo ante
      Regla 3b (bifurcación técnica), Regla 12 (sync-back), precondición
      ausente o info insuficiente.
    - Pipeline en `auto`: los 4 docs (+ apply) se completan sin pausa entre
      steps y sin pausa dentro de cada step. Sólo se detiene por stop events
      reales (bifurcaciones, padre ausente, colisión de ID).
    - Pipeline en `interactive`: los skills internos siguen escribiendo cada
      doc completo (auto), pero la IA se detiene ENTRE cada step terminado
      y pregunta si continúa al siguiente. NUNCA reactiva el modo interactivo
      dentro de un sub-skill.

# ---------------------------------------------------------------------------
# Step agents — elección del tipo de agente por step.
#
# Cada valor debe estar en `config.core.yaml → agent_matrix[<step>].options`.
# Si el usuario elige un valor fuera de las opciones válidas → error de
# configuración (el step no se ejecuta hasta corregirlo).
#
# Los steps sin entry acá heredan `agent_matrix[<step>].default` del core.
#
# Tipos: main | subagent | agent (ver `config.core.yaml` header para detalle).
# ---------------------------------------------------------------------------
step_agents:
  definition: main             # options: [main]                  (no overridable)
  design: main                 # options: [main, subagent, agent]
  plan: main                   # options: [main, subagent]
  apply: subagent              # options: [main, subagent, agent]
  closure: main                # options: [main]                  (no overridable, single-writer)

# ---------------------------------------------------------------------------
# Reglas condicionales locales — enabler no tiene steps condicionales.
#
# A diferencia de story (que tiene `explore` y `proposal` condicionales),
# el enabler no tiene docs opcionales — su cadena de 4 docs es siempre
# obligatoria. El criterio de cuándo CREAR un enabler (Regla 15) se evalúa
# ANTES de invocar el orquestador, no dentro del workflow.
# ---------------------------------------------------------------------------
conditional_rules: {}

# ---------------------------------------------------------------------------
# Referencias cruzadas
#
# `self` incluye ambas ubicaciones para explicitar dónde termina el archivo
# post-install y dónde vive el template.
# ---------------------------------------------------------------------------
references:
  self:
    runtime: .fremi/settings/enabler/config.user.yaml               # PROYECTO (donde se lee en runtime)
    framework_template: ~/.fremi/framework/artifacts/enabler/config.user.yaml  # ESTE archivo (template)
  workflow: ~/.fremi/framework/artifacts/enabler/workflow.yaml
  agent_matrix: ~/.fremi/framework/artifacts/enabler/config.core.yaml
  applied_rules: ~/.fremi/framework/artifacts/enabler/rules/applies.yaml
  master_config: ~/.fremi/framework/settings/config.core.yaml
  methodology: ~/.fremi/framework/settings/methodology.core.yaml
  rules_index: ~/.fremi/framework/rules/workflow.md
  orchestrator_skill: /fremi-enabler
