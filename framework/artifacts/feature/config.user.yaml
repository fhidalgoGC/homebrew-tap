schema: framework-layer-user-config
schema_version: 6
layer: feature
since: 2026-08-10
# v6 (2026-08-10): la SECUENCIA canónica se movió a workflow.yaml (fuente única).
#                  Este archivo queda con SÓLO user choices: active, execution_mode,
#                  step_agents (elección de agente por step), conditional_rules.
# v5 (2026-07-13): esquema previo con docs[], flow.sequence[], parallel_allowed[].

# ===========================================================================
# CONFIG.USER — capa FEATURE
#
# ÚNICO archivo user-editable de esta capa. Cambiá acá para adaptar la
# ejecución del workflow a tu proyecto sin tocar la estructura del framework.
#
# ---------------------------------------------------------------------------
# UBICACIÓN Y RESOLUCIÓN EN RUNTIME (importante)
#
# Este archivo dentro del framework
# (`~/.fremi/framework/artifacts/feature/config.user.yaml`) es un TEMPLATE.
# Al correr `fremi install` en un proyecto, se copia a:
#     <project>/.fremi/settings/feature/config.user.yaml
#
# El orquestador resuelve así en runtime:
#   1. Lee `<project>/.fremi/settings/feature/config.user.yaml` (versión del proyecto).
#   2. Si no existe → fallback a `~/.fremi/framework/artifacts/feature/config.user.yaml` (este template).
#
# Editar este archivo del framework cambia el DEFAULT que reciben proyectos
# NUEVOS al instalar. Proyectos ya instalados usan su propio copy en
# `.fremi/settings/feature/`.
# ---------------------------------------------------------------------------
#
# Este archivo NO contiene:
#   - la secuencia canónica del workflow → `workflow.yaml`
#   - las agent options estructuralmente válidas → `config.core.yaml`
#   - las reglas globales aplicables → `rules/applies.yaml`
# ===========================================================================

active: true

# ---------------------------------------------------------------------------
# Execution mode — override opcional del default global (settings/config.core.yaml)
#
# - `default`: modo por default para skills sueltos de esta capa cuando el
#   usuario no pasa `--mode` en la invocación.
# - `pipeline_default`: modo por default cuando se invoca /fremi-pipeline-feature.
#
# Comentar/omitir todo este bloque para heredar del master.
# ---------------------------------------------------------------------------
execution_mode:
  # Modo default para skills sueltos de esta capa (`/fremi-feature`, `/fremi-feature-adr`).
  # interactive → pausa DENTRO del skill validando cada sección con el usuario.
  # auto        → escribe el doc entero de un tirón.
  default: interactive

  # Modo default para el pipeline (`/fremi-pipeline-feature`).
  # interactive → pausa ENTRE STEPS (los skills internos SIEMPRE corren en auto).
  # auto        → corre toda la cadena sin pausa (pausa sólo por stop events).
  pipeline_default: auto

  notes: >
    Feature tiene 1 doc obligatorio (doc `definition`) + doc `decisions`
    condicional (ver conditional_rules.feature_decisions_when).

    - Skill suelto en `interactive`: la IA propone cada capacidad, cada línea
      in-scope, cada restricción, cada término del glosario antes de escribirlos.
    - Skill suelto en `auto`: compone el doc `definition` completo; pausa sólo
      ante Regla 3b, Regla 12 (sync-back a producto) o colisión de slug.
    - Pipeline en `auto`: crea definition + sync-back + bump del doc `plan`
      padre sin pausas. Si `--first-story` está activo, encadena directo.
    - Pipeline en `interactive`: los sub-skills internos corren en auto
      (crean el doc entero de una), pero la IA pausa ENTRE cada step del
      pipeline — típicamente después de crear la feature y antes de arrancar
      la primera story si se pasó `--first-story`.

# ---------------------------------------------------------------------------
# Step agents — elección del tipo de agente por step.
#
# Cada valor debe estar en `config.core.yaml → agent_matrix[<step>].options`.
# Si el usuario elige un valor fuera de las opciones válidas → error de
# configuración (el step no se ejecuta hasta corregirlo).
#
# Los steps sin entry acá heredan `agent_matrix[<step>].default` del core.
#
# Tipos: main | subagent | agent (ver `config.core.yaml` header para detalle).
# ---------------------------------------------------------------------------
step_agents:
  definition: main           # options: [main, subagent, agent]
  lifecycle: main            # options: [main]                  (no overridable)

# ---------------------------------------------------------------------------
# Reglas condicionales locales — cuándo aplican los docs `required: conditional`
# declarados en `workflow.yaml` / el doc `decisions` de la feature.
#
# El campo `condition_ref` del doc `decisions` apunta acá por nombre.
#
# Al arrancar la feature el orquestador puede evaluar estos criterios para
# determinar si crear el doc `decisions` o no.
# ---------------------------------------------------------------------------
conditional_rules:

  feature_decisions_when:
    description: >
      El doc `decisions` de una feature es OBLIGATORIO cuando la feature
      tiene ADRs LOCALES (que sólo aplican a esa feature). Opcional en
      caso contrario.
    obligatory_if_any:
      - "Hay al menos un ADR aceptado que aplica sólo a esta feature (no transversal a producto)."
    optional_default: >
      Todos los ADRs de la feature son transversales al producto y viven en
      el doc `decisions` de producto.

# ---------------------------------------------------------------------------
# Referencias cruzadas
#
# `self` incluye ambas ubicaciones para explicitar dónde termina el archivo
# post-install y dónde vive el template.
# ---------------------------------------------------------------------------
references:
  self:
    runtime: .fremi/settings/feature/config.user.yaml               # PROYECTO (donde se lee en runtime)
    framework_template: ~/.fremi/framework/artifacts/feature/config.user.yaml  # ESTE archivo (template)
  workflow: ~/.fremi/framework/artifacts/feature/workflow.yaml
  agent_matrix: ~/.fremi/framework/artifacts/feature/config.core.yaml
  applied_rules: ~/.fremi/framework/artifacts/feature/rules/applies.yaml
  master_config: ~/.fremi/framework/settings/config.core.yaml
  methodology: ~/.fremi/framework/settings/methodology.core.yaml
  rules_index: ~/.fremi/framework/rules/workflow.md
  orchestrator_skill: /fremi-feature
