schema: framework-layer-user-config
schema_version: 6
layer: story
since: 2026-08-10
# v6 (2026-08-10): la SECUENCIA canónica se movió a workflow.yaml (fuente única).
#                  Este archivo queda con SÓLO user choices: active, execution_mode,
#                  step_agents (elección de agente por step), conditional_rules.
# v5 (2026-07-13): esquema previo consolidando docs[], flow.sequence[], etc.

# ===========================================================================
# CONFIG.USER — capa STORY
#
# ÚNICO archivo user-editable de esta capa. Cambiá acá para adaptar la
# ejecución del workflow a tu proyecto sin tocar la estructura del framework.
#
# ---------------------------------------------------------------------------
# UBICACIÓN Y RESOLUCIÓN EN RUNTIME (importante)
#
# Este archivo dentro del framework
# (`~/.fremi/framework/artifacts/story/config.user.yaml`) es un TEMPLATE.
# Al correr `fremi install` en un proyecto, se copia a:
#     <project>/.fremi/settings/story/config.user.yaml
#
# El orquestador resuelve así en runtime:
#   1. Lee `<project>/.fremi/settings/story/config.user.yaml` (versión del proyecto).
#   2. Si no existe → fallback a `~/.fremi/framework/artifacts/story/config.user.yaml` (este template).
#
# Editar este archivo del framework cambia el DEFAULT que reciben proyectos
# NUEVOS al instalar. Proyectos ya instalados usan su propio copy en
# `.fremi/settings/story/`.
# ---------------------------------------------------------------------------
#
# Este archivo NO contiene:
#   - la secuencia canónica del workflow → `workflow.yaml`
#   - las agent options estructuralmente válidas → `config.core.yaml`
#   - las reglas globales aplicables → `rules/applies.yaml`
# ===========================================================================

active: true

# ---------------------------------------------------------------------------
# Execution mode — override opcional del default global (settings/config.core.yaml)
#
# - `default`: modo por default para skills sueltos de esta capa cuando el
#   usuario no pasa `--mode` en la invocación.
# - `pipeline_default`: modo por default cuando se invoca /fremi-pipeline-story.
#
# Comentar/omitir todo este bloque para heredar del master.
# ---------------------------------------------------------------------------
execution_mode:
  # Modo default para skills sueltos de esta capa (`/fremi-story-*`).
  # interactive → pausa DENTRO del skill validando cada sección con el usuario.
  # auto        → escribe el doc entero de un tirón.
  default: interactive

  # Modo default para el pipeline (`/fremi-pipeline-story`).
  # interactive → pausa ENTRE STEPS (los skills internos SIEMPRE corren en auto).
  # auto        → corre toda la cadena sin pausa (pausa sólo por stop events).
  pipeline_default: auto

  notes: >
    Stories tienen 9 docs obligatorios + 2 condicionales (workflow.yaml → steps).

    - Skill suelto en `interactive`: la IA propone cada CA, cada SC, cada
      contrato SDD, cada elección de tech, cada TC, cada task-XXX antes de
      escribirlo — y espera OK.
    - Skill suelto en `auto`: llena el doc entero solo; pausa sólo ante
      Regla 3b, Regla 12, precondición ausente o info insuficiente.
    - Pipeline en `auto`: los 9 (o 11) docs se completan sin pausa entre
      steps y sin pausa dentro de cada step. Sólo se detiene por stop
      events reales.
    - Pipeline en `interactive`: los skills internos siguen escribiendo cada
      doc completo (auto), pero la IA se detiene ENTRE cada step terminado
      y pregunta si continúa al siguiente. Es el pipeline con checkpoints
      por doc — NUNCA reactiva el modo interactivo dentro de un sub-skill.

# ---------------------------------------------------------------------------
# Step agents — elección del tipo de agente por step.
#
# Cada valor debe estar en `config.core.yaml → agent_matrix[<step>].options`.
# Si el usuario elige un valor fuera de las opciones válidas → error de
# configuración (el step no se ejecuta hasta corregirlo).
#
# Los steps sin entry acá heredan `agent_matrix[<step>].default` del core.
#
# Tipos: main | subagent | agent (ver `config.core.yaml` header para detalle).
# ---------------------------------------------------------------------------
step_agents:
  explore: subagent            # options: [main, subagent, agent]
  definition: main             # options: [main]                  (no overridable)
  proposal: main               # options: [main]                  (no overridable)
  scope: main                  # options: [main]                  (no overridable)
  bdd: subagent                # options: [main, subagent, agent]
  sdd: main                    # options: [main, subagent, agent]
  design: main                 # options: [main]                  (no overridable)
  tdd: subagent                # options: [main, subagent, agent]
  plan: main                   # options: [main, subagent]
  apply: subagent              # options: [main, subagent, agent]
  checkwork: main              # options: [main]                  (no overridable, single-writer)
  verify: subagent             # options: [main, subagent, agent]
  closure-check: subagent      # options: [main, subagent, agent]
  closure: main                # options: [main]                  (no overridable)

# ---------------------------------------------------------------------------
# Reglas condicionales locales — cuándo aplican los steps `required: conditional`
# declarados en `workflow.yaml`. El campo `condition_ref` del step apunta
# acá por nombre.
#
# Al arrancar la story el orquestador presenta estos criterios al usuario y
# le pregunta si aplica al menos UNO. Si sí → el step es obligatorio para
# esta story. Si no → se omite (no se crea placeholder).
# ---------------------------------------------------------------------------
conditional_rules:

  explore_when:
    description: >
      `explore` es OBLIGATORIO cuando aplica al menos UNA de las siguientes;
      opcional en el resto de los casos.
    obligatory_if_any:
      - "La story toca un área del codebase que el implementador no conoce."
      - "Existen 2+ approaches técnicos plausibles que ameritan comparar antes de proponer."
      - "La story integra con una librería/servicio externo no usado antes en el proyecto."
      - "La story es de migración o reemplazo (ej: cambiar de X a Y)."
    optional_default: >
      Bug fixes chicos, cambios triviales de configuración, refactors
      locales sin cambio de comportamiento — el explore no aporta.
    empty_placeholder_allowed: true

  proposal_when:
    description: >
      `proposal` es OBLIGATORIO cuando aplica al menos UNA de las siguientes;
      opcional en el resto de los casos.
    obligatory_if_any:
      - "La story introduce un contrato externo nuevo (endpoint, evento, comando público)."
      - "La story tiene una bifurcación técnica que dispara Regla 3b."
      - "La story afecta 3+ archivos no triviales o cruza módulos."
      - "La story cambia comportamiento visible al usuario final."
      - "La story tiene riesgo de rollback (migración de datos, API break, etc.)."
    optional_default: >
      Bug fixes locales sin cambio de contrato, cambios de wording,
      ajustes de configuración interna.
    empty_placeholder_allowed: true

# ---------------------------------------------------------------------------
# Referencias cruzadas
#
# `self` incluye ambas ubicaciones para explicitar dónde termina el archivo
# post-install y dónde vive el template.
# ---------------------------------------------------------------------------
references:
  self:
    runtime: .fremi/settings/story/config.user.yaml               # PROYECTO (donde se lee en runtime)
    framework_template: ~/.fremi/framework/artifacts/story/config.user.yaml  # ESTE archivo (template)
  workflow: ~/.fremi/framework/artifacts/story/workflow.yaml
  agent_matrix: ~/.fremi/framework/artifacts/story/config.core.yaml
  applied_rules: ~/.fremi/framework/artifacts/story/rules/applies.yaml
  master_config: ~/.fremi/framework/settings/config.core.yaml
  methodology: ~/.fremi/framework/settings/methodology.core.yaml
  rules_index: ~/.fremi/framework/rules/workflow.md
  orchestrator_skill: /fremi-story
