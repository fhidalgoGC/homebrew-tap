schema: framework-layer-core
schema_version: 5
layer: story
since: 2026-08-10
# v5 (2026-08-10): la SECUENCIA canónica se movió a workflow.yaml (fuente única).
#                  Este archivo queda con SÓLO agent_matrix + parallelism topology.
# v4 (2026-07-16): `agent` pasa a ser estructura con `options` + `default` + `reasoning`.
# v3 (2026-07-16): agrega `agent` (main | subagent) + `agent_reason` por step.
# v2 (2026-07-16): agrega `requires_complete` + `consumes` a step_matrix.

# ===========================================================================
# CONFIG.CORE — capa STORY
#
# Fuente de verdad ESTRUCTURAL — el usuario NO edita este archivo.
# Sólo el mantenedor del framework lo cambia cuando la topología de
# ejecución muta (agent options nuevos, paralelismo diferente, etc.).
#
# Este archivo NO contiene la SECUENCIA del workflow — eso vive en
# workflow.yaml. Acá sólo:
#   - agent_matrix: qué agentes pueden ejecutar cada step (options + default + reasoning)
#   - single_writer: qué steps son single-writer
#   - internal_items: paralelismo INTRA-step (items del mismo tipo generados en paralelo)
#   - cross_instance: paralelismo INTER-story (múltiples stories a la vez)
#
# - Toggle on/off del paralelismo → `~/.fremi/framework/settings/config.core.yaml → parallelism.enabled`.
# - Elección concreta de agent por step → `config.user.yaml → step_agents`.
# - Steps enumerados acá deben existir en `workflow.yaml` con el mismo `id`.
# ===========================================================================

# ---------------------------------------------------------------------------
# AGENT MATRIX — para cada step del workflow, qué tipos de agente son
# ESTRUCTURALMENTE viables.
#
# Tipos:
#   - main     → el agente principal (thread del usuario). Necesario ante
#                decisiones de negocio, bifurcaciones Regla 3b, escritura
#                sobre docs living single-writer, o co-creación con el usuario.
#   - subagent → subagente aislado spawneado vía Task tool (context propio,
#                retorna al main). Ideal para trabajo auto-contenido:
#                research, generación determinista, ejecución mecánica.
#   - agent    → agente ESPECIALIZADO (subagent_type específico como Explore,
#                Plan, sdd-apply, o un agent-type custom del proyecto). Se
#                diferencia de `subagent` en que tiene system prompt de
#                dominio + tools acotados.
#
# Sólo los tipos listados en `options` son elegibles. El usuario elige uno en
# `config.user.yaml → step_agents[<step>]`; si no lo elige, se usa `default`.
# Elegir un tipo que NO está en `options` es error de configuración.
#
# `single_writer: true` → la ESCRITURA sobre el doc producido se serializa
# aunque el step corra con subagentes.
#
# Regla dura: subagentes y agentes NUNCA interactúan con el usuario. Si
# `execution_mode: interactive`, el main pausa al retornar el subagente/agente
# para que el usuario valide antes de continuar.
# ---------------------------------------------------------------------------
agent_matrix:

  explore:
    options: [main, subagent, agent]
    default: subagent
    reasoning:
      subagent: >
        Investigación auto-contenida: leer código, mapear terreno, listar
        alternativas técnicas. No requiere decisiones de negocio ni
        escritura sobre docs compartidos. Aísla y preserva context del main.
      main: >
        Si el user quiere hacer el explore CO-creando con la IA (revisar
        hallazgos sobre la marcha, decidir qué alternativas profundizar).
      agent: >
        Si hay un agente especializado en exploración del stack del proyecto
        (ej: agente Explore de Claude Code o uno custom). Aporta system prompt
        dominio-específico + tools acotados a search/read.

  definition:
    options: [main]
    default: main
    reasoning:
      main: >
        Co-creación de negocio con el usuario: "As a / I want / So that"
        + criterios de aceptación. Requiere validación humana de cada criterio. No
        delegable a subagente sin perder la conversación de framing.

  proposal:
    options: [main]
    default: main
    reasoning:
      main: >
        El proposal contiene Decisions con bifurcaciones Regla 3b — pausan
        y consultan al usuario. Un subagente aislado no puede resolver
        esas pausas.

  scope:
    options: [main]
    default: main
    reasoning:
      main: >
        Decisión de negocio sobre qué queda dentro/fuera. El usuario valida
        los límites para evitar scope creep. No delegable.

  bdd:
    options: [main, subagent, agent]
    default: subagent
    reasoning:
      subagent: >
        Traducción determinista de CAs a scenarios Given/When/Then. Genera
        múltiples scenarios en paralelo (ver internal_items.bdd). Main revisa
        al final.
      main: >
        Si execution_mode=interactive y el usuario quiere validar cada
        scenarios individualmente durante la redacción.
      agent: >
        Si hay agente especializado en BDD (Cucumber/Gherkin) con reglas
        del proyecto codificadas.

  sdd:
    options: [main, subagent, agent]
    default: main
    reasoning:
      main: >
        SDD es donde nacen las decisiones de contrato externo — Regla 3b
        típicamente aparece (protocolo, esquema, códigos HTTP). Main
        por default para poder pausar.
      subagent: >
        Sólo si el usuario garantiza que NO hay bifurcaciones (contratos
        triviales derivados 1:1 de BDD). Cada contrato puede ir en su
        subagente (ver internal_items.sdd).
      agent: >
        Si hay agente especializado en API design / contract-first
        (OpenAPI, GraphQL SDL) con reglas del proyecto.

  design:
    options: [main]
    default: main
    reasoning:
      main: >
        Design es la capa con MÁS bifurcaciones técnicas (Regla 3b).
        Elección de librería/wrapper/capa cascadea al resto. Componentes
        individuales pueden paralelizarse en subagentes DESPUÉS de que
        las decisiones tech estén tomadas (ver internal_items.design) — pero el
        orquestador de esos subs sigue siendo el main.

  tdd:
    options: [main, subagent, agent]
    default: subagent
    reasoning:
      subagent: >
        Mapeo determinista SC/SDD → test cases. Genera TCs en paralelo (ver
        internal_items.tdd). Main revisa cobertura.
      main: >
        Si el usuario quiere validar cada TC uno por uno.
      agent: >
        Si hay agente especializado en test planning con testing.stack
        del proyecto (Vitest, Jest, e2e-aws-lambda…).

  plan:
    options: [main, subagent]
    default: main
    reasoning:
      main: >
        Descomposición requiere juicio: orden, granularidad, criterios
        verificables (Regla 7b). Además el usuario suele intervenir en la
        priorización.
      subagent: >
        Si el usuario acepta que el sub proponga una descomposición
        inicial y el main revise/priorice al final.

  apply:
    options: [main, subagent, agent]
    default: subagent
    orchestration:
      main_responsibilities:
        - "Elegir próxima task (respetando depends_on)."
        - "Lanzar subagente/agente con contexto de la task (design, TDs, archivos)."
        - "Recibir reporte del subagente."
        - "Serializar update de checkwork (single-writer)."
        - "Pausar ante bifurcaciones Regla 3b (el sub NO decide)."
    reasoning:
      subagent: >
        Cada task es unidad aislada: leer design, escribir test rojo,
        implementar, verde. Un subagente por task encaja perfecto.
        El main coordina + serializa checkwork.
      main: >
        Si el usuario prefiere ejecutar cada task él mismo (con la IA
        asistiendo en la conversación principal, sin fan-out).
      agent: >
        Si hay agente especializado en apply/coding (como `sdd-apply` de
        Claude Code) con tools acotados a Edit/Write/Bash.

  checkwork:
    options: [main]
    default: main
    single_writer: true
    reasoning:
      main: >
        Doc LIVING single-writer (Regla 13). Aunque las tasks corran en
        subagentes en paralelo, la escritura del checkwork la serializa
        el main para evitar race conditions.

  verify:
    options: [main, subagent, agent]
    default: subagent
    reasoning:
      subagent: >
        Ejecución mecánica: correr test_runner, type_checker, coverage.
        Sin decisiones — output es verdict. Subagente aislado corre y
        reporta.
      main: >
        Si el usuario quiere ver el runner en vivo en su thread.
      agent: >
        Si hay agente especializado en test verification (como `sdd-verify`
        de Claude Code) con tools acotados a Bash.

  closure-check:
    options: [main, subagent, agent]
    default: subagent
    reasoning:
      subagent: >
        Auditoría automatizada: cruzar CA → SC → SDD → test → código,
        verificar bumps de versión, sync-back, DoD. Sin decisiones — output
        es lista de gaps clasificados.
      main: >
        Si el usuario quiere ver la auditoría paso a paso.
      agent: >
        Si hay agente especializado en compliance / trazabilidad.

  closure:
    options: [main]
    default: main
    reasoning:
      main: >
        Firma final + bump del feature padre (Regla 17). Escritura sobre
        docs compartidos con la feature (single-writer). Serialize con
        otras stories cerrando en paralelo — sólo main puede coordinar.

# ---------------------------------------------------------------------------
# INTERNAL ITEMS — paralelismo INTRA-step.
#
# Dentro de un step que produce N items del mismo tipo, ¿pueden generarse
# en paralelo por subagentes? El agent-type usado internamente hereda del
# step (o del override en config.user.yaml → step_agents).
#
# Steps ausentes acá → items secuenciales (default).
# ---------------------------------------------------------------------------
internal_items:

  bdd:
    unit: scenario                # IDs configurables — ver methodology.core.yaml → identifiers.scenario (default: scenarios)
    allow_parallel: true
    max_concurrent: 5
    merge_strategy: append-numbered
    reason: >
      Cada escenario Given/When/Then es independiente del resto. Un
      subagente puede generar múltiples escenarios en paralelo si conoce
      los criterios de aceptación de definition.

  sdd:
    unit: contract
    allow_parallel: true
    max_concurrent: 3
    merge_strategy: append-per-section
    reason: >
      Cada contrato externo (endpoint, evento, comando) puede escribirse
      independiente. Tabla de errores + NFRs se consolidan al final.
    merge_hazards:
      - "Contratos que comparten schema/tipo — resolver en una sola pasada."

  design:
    unit: component
    allow_parallel: true
    max_concurrent: 3
    merge_strategy: append-per-section
    reason: >
      Cada componente/wrapper/adapter puede diseñarse aislado. Diagrama de
      secuencia + estructura de archivos se consolidan al final.
    merge_hazards:
      - "Elecciones de tecnología deben resolverse ANTES de descomponer en components (Regla 3b)."

  tdd:
    unit: test-case               # IDs configurables — ver methodology.core.yaml → identifiers.test_case (default: test cases)
    allow_parallel: true
    max_concurrent: 5
    merge_strategy: append-numbered
    reason: >
      Cada test case mapea a un escenario o cláusula del step `sdd`
      independiente. El plan de coverage se consolida al final.

  plan:
    unit: task                    # IDs configurables — ver methodology.core.yaml → identifiers.task (default: task-XXX)
    allow_parallel: false
    allow_parallel_when: >
      Las tasks explicitan `depends_on` y el grafo no tiene ciclos.
      Entonces las tasks sin dependencias entre sí pueden ejecutarse en
      paralelo durante APPLY (no durante creación del plan).
    reason: >
      La CREACIÓN del plan es secuencial (el orden importa).
      La EJECUCIÓN (apply) puede paralelizar tasks independientes.

  apply:
    unit: task                    # mismo IDs que plan
    allow_parallel: true
    max_concurrent: 3
    conditions:
      - "Cada task declara `depends_on: []` o lista explícita."
      - "Tasks paralelas NO tocan los mismos archivos."
      - "Cada task tiene su test rojo + verde antes de mergear (Regla 7)."
    reason: >
      Tasks independientes (diferentes módulos/archivos) pueden ejecutarse
      por subagentes en paralelo.
    merge_hazards:
      - "Multiple writers a checkwork → serialize (single_writer)."
      - "Coverage/testing global corre después del merge, no en paralelo."

# ---------------------------------------------------------------------------
# CROSS INSTANCE — paralelismo INTER-story.
# Entre múltiples stories corriendo al mismo tiempo.
# ---------------------------------------------------------------------------
cross_instance:

  same_feature:
    allow_parallel_planning: true       # explore..plan de dos stories a la vez
    allow_parallel_implementation: true # apply de dos stories en paralelo
    conditions:
      - "Stories NO comparten CAs ni escenarios BDD."
      - "Stories tocan archivos diferentes."
      - "Actualizaciones al feature/decisions.md se serializan al cierre (Regla 17)."
    merge_hazards:
      - "Cierre en paralelo → conflicto de bump del feature padre. Serialize al closure."
      - "ADRs de story promovidos a feature/producto → conflict resolver."
    reason: >
      Común querer avanzar 2-3 stories de una feature en paralelo. Los
      subagentes pueden orquestar esto si respetan las condiciones.

  cross_feature:
    allow_parallel: true
    reason: >
      Stories de distintas features típicamente tocan áreas distintas del
      codebase. Sin dependencia técnica compartida → paralelas.

# ---------------------------------------------------------------------------
# Referencias cruzadas
#
# `config.user.yaml` es user-editable: runtime lee del PROYECTO
# (`.fremi/settings/<capa>/config.user.yaml`). Si no existe, fallback al
# TEMPLATE del framework. Los demás archivos viven SÓLO en el framework.
# ---------------------------------------------------------------------------
references:
  workflow: ~/.fremi/framework/artifacts/story/workflow.yaml
  user_choices:
    runtime: .fremi/settings/story/config.user.yaml               # PROYECTO (preferido en runtime)
    framework_template: ~/.fremi/framework/artifacts/story/config.user.yaml  # FALLBACK / template inicial
  applied_rules: ~/.fremi/framework/artifacts/story/rules/applies.yaml
  master_config: ~/.fremi/framework/settings/config.core.yaml
