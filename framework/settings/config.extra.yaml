schema: framework-layer-config
schema_version: 1
layer: extra
since: 2026-07-13

# ---------------------------------------------------------------------------
# Configuración operativa de la capa EXTRA.
# Trabajo fuera del flujo lineal (tooling, scripts, IaC, refactor de utilidades,
# mejoras a la metodología). Archivo único EX-NN_<slug>.md — un archivo por
# concepto cohesivo. NO usar como excusa para saltar el flujo cuando el trabajo
# SÍ es spec-driven (Regla 14).
# ---------------------------------------------------------------------------

active: true

# Archivo único, no cadena de docs
single_file: true

location: docs/works/extra/{filename}
skill: null   # no hay skill dedicado; se edita a mano (o vía scaffold si se
              # crea un helper genérico en el futuro)

numbering: global   # EX-NN secuencial al proyecto

# ---------------------------------------------------------------------------
# Secciones del archivo
# ---------------------------------------------------------------------------
sections:
  - name: what-was-done
    required: always
    description: Resumen ejecutivo — qué se hizo (2-5 líneas)

  - name: why-not-feature-story-task
    required: always
    description: Justificación de por qué esto NO es feature/story/task (Regla 14)

  - name: concrete-changes
    required: always
    description: Lista de archivos/paths con qué cambió en cada uno

  - name: validation
    required: always
    description: Cómo se probó (comandos, verificaciones manuales, etc.)

  - name: linkages
    required: conditional
    condition_ref: extra_linkages_when
    description: Vinculaciones (ADRs, stories, otros EX-NN relacionados)

  - name: notes-learnings
    required: conditional
    condition_ref: extra_notes_when
    description: Notas / aprendizajes / gotchas encontrados

# ---------------------------------------------------------------------------
# Reglas condicionales
# ---------------------------------------------------------------------------
conditional_rules:
  extra_linkages_when:
    description: >
      Sección obligatoria si el trabajo del extra referencia ADRs, stories o
      otros EX relacionados.
    obligatory_if_any:
      - "El extra cambió/mejoró un ADR existente."
      - "El extra habilita/afecta stories ya cerradas o en progreso."
      - "El extra se relaciona con un EX-NN anterior."

  extra_notes_when:
    description: >
      Sección de notas/aprendizajes — obligatoria cuando durante el trabajo
      surgen aprendizajes reusables o gotchas no obvios.
    obligatory_if_any:
      - "Se descubrió un gotchas o edge case durante el trabajo."
      - "Se estableció una convención informal que otros deberían saber."

# ---------------------------------------------------------------------------
# FLOW — extra NO tiene skill dedicado. Es edición manual del archivo.
# Los pasos de creación viven en `procedure_manual` como guía para el usuario;
# NO son steps del flow porque no son skills invocables.
# ---------------------------------------------------------------------------
flow:
  sequence: []   # Extra no tiene skills — edición manual del archivo.
  parallel_allowed: []

# ---------------------------------------------------------------------------
# PROCEDURE MANUAL — instrucciones para el usuario al crear un EX-NN.
# ---------------------------------------------------------------------------
procedure_manual:
  - action: Identificar próximo EX-NN
    command: "ls docs/works/extra/ | grep EX- | sort | tail -1 → +1"

  - action: Crear EX-NN_<slug>.md con las 4 secciones obligatorias
    sections_required:
      - what-was-done
      - why-not-feature-story-task
      - concrete-changes
      - validation

  - action: Si aplica → agregar secciones condicionales (linkages, notes-learnings)
    condition: "config.extra.yaml → conditional_rules"

# ---------------------------------------------------------------------------
# Anti-patrones
# ---------------------------------------------------------------------------
anti_patterns:
  - "Usar extra/ como excusa para saltar el flujo cuando el trabajo SÍ es spec-driven (un endpoint nuevo va a story, no acá)"
  - "Crear EX-NN por cada commit chico — un concepto cohesivo puede tener N commits"
  - "Notas personales / scratch pad — extra/ es para docs comprensibles por otros"
  - "Mezclar varios conceptos no-relacionados en un mismo EX-NN"

# ---------------------------------------------------------------------------
# Referencias cruzadas
# ---------------------------------------------------------------------------
references:
  master_config: docs/frmwk/settings/config.yaml
  methodology: docs/frmwk/settings/methodology.json
  rules: docs/frmwk/rules/workflow.md
  regla_14: "docs/frmwk/rules/workflow.md § Regla 14 (trabajo fuera del flujo)"
