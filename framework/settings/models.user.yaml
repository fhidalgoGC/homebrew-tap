# models.user.yaml
# --------------------------------------------------------------
# Per-project model assignments. This file is a snapshot of the
# framework defaults (models.core.yaml) that you can edit freely.
#
# Edit values via `fremi setting → models` — the interactive editor
# shows the framework default beside every skill and lets you pick
# from the catalog of aliases available for your agent (Claude Code,
# Cursor, ...). Or edit this file directly.
#
# Values can be either:
#   - An alias (opus / sonnet / haiku) — portable across agents.
#     The alias resolves to a concrete model at runtime based on
#     which agent tool you're using (see models.core.yaml → aliases).
#   - A concrete model ID from the agent's catalog (e.g.
#     claude-opus-4-7, claude-sonnet-4-6, claude-haiku-4-5-20251001)
#     — pins the skill to that exact model regardless of agent.
#
# Heuristic behind the defaults:
#   - opus:   architectural work, design decisions, ADRs, proposals
#   - sonnet: structured writing (specs, BDD, TDD plans, apply/verify)
#   - haiku:  mechanical / clerical work (closure, checkwork, scaffold)
#
# Master switch:
#   active: true  -> these assignments are applied
#   active: false -> falls back to core defaults for this project
# --------------------------------------------------------------

schema: fremi-models-user
schema_version: 1
active: true

# --------------------------------------------------------------
# Model catalog per agent tool. Snapshot of the framework catalog;
# edit if a new model ships and you don't want to wait for a fremi
# update. The editor at `fremi setting → models` reads this list
# to build the "pick a model" menu.
#
# Note: the `claude` CLI does NOT expose a way to list its models
# programmatically (tried --help / error messages / etc.), so this
# file is the source of truth on your machine. Update by hand as
# needed.
# --------------------------------------------------------------
catalog:
  claude:
    - claude-opus-4-7
    - claude-sonnet-4-6
    - claude-haiku-4-5-20251001
  cursor: []      # populated when Cursor support ships
  windsurf: []
  aider: []

# --------------------------------------------------------------
# Aliases — logical names that skills reference. Each alias
# resolves to a concrete model per agent tool at runtime.
# --------------------------------------------------------------
aliases:
  claude:
    opus: claude-opus-4-7
    sonnet: claude-sonnet-4-6
    haiku: claude-haiku-4-5-20251001

# --------------------------------------------------------------
# Per-skill model assignment.
# --------------------------------------------------------------
skills:
  default: sonnet

  # Product layer — architectural + discovery
  fremi-product: opus
  fremi-product-iniciativas: sonnet
  fremi-product-ideas: sonnet
  fremi-product-planteamiento: sonnet
  fremi-product-definition: sonnet
  fremi-product-strategies: opus
  fremi-product-adr: opus
  fremi-product-plan: sonnet

  # Feature layer
  fremi-feature: opus
  fremi-feature-adr: opus
  fremi-feature-bug: sonnet

  # Story layer — biggest surface
  fremi-story: sonnet
  fremi-story-explore: sonnet
  fremi-story-definition: sonnet
  fremi-story-proposal: opus
  fremi-story-scope: sonnet
  fremi-story-bdd: sonnet
  fremi-story-sdd: sonnet
  fremi-story-design: opus            # design decisions → opus
  fremi-story-tdd: sonnet
  fremi-story-plan: sonnet
  fremi-story-task: sonnet
  fremi-story-checkwork: haiku        # live progress tracking, mechanical
  fremi-story-verify: sonnet
  fremi-story-closure-check: haiku
  fremi-story-closure: sonnet
  fremi-story-adr: opus
  fremi-story-bug: sonnet

  # Enabler layer — technical enablement
  fremi-enabler: sonnet
  fremi-enabler-definition: sonnet
  fremi-enabler-design: opus
  fremi-enabler-plan: sonnet
  fremi-enabler-closure: sonnet

  # Reverse engineering
  fremi-reverse-product: opus
  fremi-reverse-feature: sonnet
  fremi-reverse-story: sonnet
  fremi-reverse-enabler: sonnet
  fremi-reverse-bug: sonnet
  fremi-reverse-extra: sonnet

  # Tools / scaffolding (all mechanical → haiku)
  fremi-tools: haiku
  fremi-add-skill: haiku
  fremi-add-rule: haiku
  fremi-add-hook: haiku
  fremi-add-mcp: haiku
  fremi-delete-skill: haiku
  fremi-delete-rule: haiku
  fremi-delete-hook: haiku
  fremi-delete-mcp: haiku

  # Global / transversal
  fremi-sync-check: sonnet
  fremi-install-framework: haiku
