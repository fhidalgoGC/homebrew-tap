schema: fremi-agents-user
schema_version: 1

# ============================================================================
# AGENTS.USER — per-project override of agent defaults.
#
# You can:
#   - Override the default model or effort of a registered subagent for this
#     project (e.g. bump `fremi-apply` from sonnet → opus for a hard project).
#   - Point a subagent alias at a different Claude Code native agent.
#   - Register project-specific external agents (future).
#
# Anything you do NOT override inherits from
# ~/.fremi/framework/settings/agents.core.yaml.
#
# The framework's copy of this file lives under the framework repo and is a
# TEMPLATE. When you run `fremi install`, this file is copied to
# `.fremi/settings/agents.user.yaml` inside your project. Edits made there
# apply only to that project.
# ============================================================================

active: true

# ---------------------------------------------------------------------------
# Default model — fallback used by ANY fremi skill that does NOT have an
# explicit override in models.user.yaml. Acts as the project-wide "when
# in doubt, use this" model.
#
# Values:
#   - alias:           opus | sonnet | haiku
#                      (portable across agents; resolved per agent at
#                      runtime via models.core.yaml → aliases)
#   - concrete model:  e.g. claude-opus-4-7, claude-sonnet-4-6,
#                      claude-haiku-4-5-20251001
#                      (pins the fallback to that specific model)
#
# Edit via `fremi setting → agents → 🎯 Edit default model`.
# ---------------------------------------------------------------------------
default_model: sonnet

# ---------------------------------------------------------------------------
# Overrides — uncomment the entries you want to change.
# ---------------------------------------------------------------------------
subagent_overrides:
  # Example: use opus for implementations in this project.
  # fremi-apply:
  #   model: opus

  # Example: deeper exploration for reverse-engineering-heavy projects.
  # fremi-explore:
  #   effort: veryThorough

  # Example: swap out the underlying Claude Code agent (advanced).
  # fremi-verify:
  #   claude_code_agent: general-purpose
  #   model: sonnet

# ---------------------------------------------------------------------------
# External agents this project uses (future — leave empty for now).
# ---------------------------------------------------------------------------
agent_overrides: {}
