# models.core.yaml
# --------------------------------------------------------------
# Framework model assignments per fremi skill. NOT user-editable
# — a `fremi update` will overwrite this file.
#
# NOTE: the catalog of available models and the alias mapping do
# NOT live in this file (or in any YAML). They are fetched fresh
# from GitHub at install/update time and cached at
# .fremi/settings/catalog/<agent>.json. The editor reads that JSON
# when you need to pick a model. Rationale: model IDs change more
# often than fremi releases; keeping them in a YAML forced a full
# release every time a new model dropped.
#
# This file only declares which alias (opus / sonnet / haiku) each
# fremi skill defaults to. Users override in
# `models.user.yaml → skills` (per-project, per-skill).
# --------------------------------------------------------------

schema: fremi-models-core
schema_version: 2
version: 2.0.0
description: >
  Model alias defaults per fremi skill. The catalog + alias mapping
  are NOT stored here — they're fetched from
  raw.githubusercontent.com/fhidalgoGC/homebrew-tap/main/catalog/<agent>.json
  at install/update time and cached locally.

# --------------------------------------------------------------
# Skills — default alias per fremi skill. Unlisted skills fall back
# to the project-wide default (agents.user.yaml → default_model).
# Users override any of these in models.user.yaml → skills.
#
# Heuristic used for the defaults:
#   - opus:   architectural work, design decisions, ADRs, proposals
#   - sonnet: structured writing (specs, BDD, TDD plans, apply/verify)
#   - haiku:  mechanical / clerical work (closure, checkwork, scaffold)
# --------------------------------------------------------------
skills:
  default: sonnet

  # Product layer — architectural + discovery
  fremi-product: opus
  fremi-product-iniciativas: sonnet
  fremi-product-ideas: sonnet
  fremi-product-planteamiento: sonnet
  fremi-product-definition: sonnet
  fremi-product-strategies: opus
  fremi-product-adr: opus
  fremi-product-plan: sonnet

  # Feature layer
  fremi-feature: opus
  fremi-feature-adr: opus
  fremi-feature-bug: sonnet

  # Story layer — biggest surface
  fremi-story: sonnet
  fremi-story-explore: sonnet
  fremi-story-definition: sonnet
  fremi-story-proposal: opus
  fremi-story-scope: sonnet
  fremi-story-bdd: sonnet
  fremi-story-sdd: sonnet
  fremi-story-design: opus
  fremi-story-tdd: sonnet
  fremi-story-plan: sonnet
  fremi-story-task: sonnet
  fremi-story-checkwork: haiku
  fremi-story-verify: sonnet
  fremi-story-closure-check: haiku
  fremi-story-closure: sonnet
  fremi-story-adr: opus
  fremi-story-bug: sonnet

  # Enabler layer
  fremi-enabler: sonnet
  fremi-enabler-definition: sonnet
  fremi-enabler-design: opus
  fremi-enabler-plan: sonnet
  fremi-enabler-closure: sonnet

  # Reverse engineering
  fremi-reverse-product: opus
  fremi-reverse-feature: sonnet
  fremi-reverse-story: sonnet
  fremi-reverse-enabler: sonnet
  fremi-reverse-bug: sonnet
  fremi-reverse-extra: sonnet

  # Tools / scaffolding
  fremi-tools: haiku
  fremi-add-skill: haiku
  fremi-add-rule: haiku
  fremi-add-hook: haiku
  fremi-add-mcp: haiku
  fremi-delete-skill: haiku
  fremi-delete-rule: haiku
  fremi-delete-hook: haiku
  fremi-delete-mcp: haiku

  # Extra (Regla 14 — trabajo fuera del flujo)
  fremi-extra: haiku

  # Global / transversal
  fremi-sync-check: sonnet
