schema: framework-reverse-skill-rules-applies
schema_version: 1
skill: fremi-reverse-bug
since: 2026-08-11
mode: reverse

# ===========================================================================
# APPLIES — reglas que el skill reverse-bug enforcea durante su ejecución.
#
# Este archivo NO contiene texto de reglas — sólo POINTERS.
#
# Nota sobre scope variable:
#   reverse-bug opera con 2 scopes: story-scoped o feature-scoped (Regla 20).
#   No existe un artifact único "bug" — el skill hereda del artifact del scope
#   que corresponde (story o feature).
# ===========================================================================

# ---------------------------------------------------------------------------
# Rules del artifact orquestado (heredadas — scope variable)
# ---------------------------------------------------------------------------
inherits:
  note: >
    El skill reverse-bug reconstruye un doc de bug dentro del scope story
    (artifacts/story) o feature (artifacts/feature). No hay un artifact "bug"
    independiente — el bug vive dentro del artifact de su scope padre.
    Las reglas del artifact padre aplican al resultado:
      scope story  → ~/.fremi/framework/artifacts/story/rules/applies.yaml
      scope feature → ~/.fremi/framework/artifacts/feature/rules/applies.yaml
    El skill resuelve el scope desde el argumento --scope en tiempo de ejecución.

# ---------------------------------------------------------------------------
# Rules específicas del skill reverse
# ---------------------------------------------------------------------------
skill_rules:
  - rules_file: ~/.fremi/framework/reverse-engineering/reverse-bug/rules/stop-events.md
    scope: reverse-skill
    note: >
      Stop events específicos de este skill reverse: síntoma del bug no
      describible desde el diff, root-cause no inferible, severidad no
      determinable, scope (story vs feature) ambiguo. Declara explícitamente
      la limitación de Regla 29 (test rojo inconstruible retroactivamente).

# ---------------------------------------------------------------------------
# Rules cross-domain siempre activas
# ---------------------------------------------------------------------------
transversal:
  - rules_file: ~/.fremi/framework/reverse-engineering/rules/reverse.md
    rules: [R25, R26, R27, R28, R29, R30, R31, R32]
    scope: global
    note: >
      Régimen completo de reverse. R29 es la regla más crítica para bugs:
      Regla 8 (test rojo primero) es INCONSTRUIBLE retroactivamente — el skill
      la declara explícitamente en la sección reproduction-red-test del doc.
      R26 (transparent default), R27 (preguntas dirigidas para síntoma, severidad,
      root-cause no inferibles), R30 (timestamps inferidos del git history).

  - rules_file: ~/.fremi/framework/rules/framework-mechanics.md
    rules: [R24]
    scope: global
    note: R24 — framework debe estar instalado antes de correr reverse.

  - rules_file: ~/.fremi/framework/rules/versioning.md
    rules: [R17]
    scope: global
    note: >
      R17 aplica en reverse (R30). Frontmatter con timestamps inferidos
      (fecha de commit del fix). Parent bump según impacto del fix:
        fix respetó contrato → PATCH del padre (story o feature)
        fix extendió contrato → MINOR
        fix cambió contrato → MAJOR + Regla 10 + ADR requerido

  - rules_file: ~/.fremi/framework/artifacts/story/rules/adr.md
    rules: [R3, R3b, R20]
    scope: global
    note: >
      ADRs reconstruidos deben respetar R3/R3b/R20. Si el fix implicó una
      decisión técnica de cambio de contrato → Regla 10 + ADR en el scope
      del bug (story o feature).

references:
  artifact_applies_story: ~/.fremi/framework/artifacts/story/rules/applies.yaml
  artifact_applies_feature: ~/.fremi/framework/artifacts/feature/rules/applies.yaml
  reverse_rules: ~/.fremi/framework/reverse-engineering/rules/reverse.md
  reverse_config: ~/.fremi/framework/settings/config.reverse.core.yaml
  reverse_flow: ~/.fremi/framework/reverse-engineering/flow.md
  skill_doc: ~/.fremi/framework/reverse-engineering/reverse-bug/SKILL.md
