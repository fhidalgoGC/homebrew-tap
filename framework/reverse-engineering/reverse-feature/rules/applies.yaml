schema: framework-reverse-skill-rules-applies
schema_version: 1
skill: fremi-reverse-feature
since: 2026-08-11
mode: reverse

# ===========================================================================
# APPLIES — reglas que el skill reverse-feature enforcea durante su ejecución.
#
# Este archivo NO contiene texto de reglas — sólo POINTERS.
# ===========================================================================

# ---------------------------------------------------------------------------
# Rules del artifact orquestado (heredadas)
# ---------------------------------------------------------------------------
inherits:
  artifact_applies: ~/.fremi/framework/artifacts/feature/rules/applies.yaml
  note: >
    El skill reverse reconstruye los docs del artifact feature (definition.md,
    y opcionalmente decisions.md). Las reglas del artifact aplican al
    RESULTADO — pero se completan con reverse-specific rules (R25-R32) que
    gobiernan la reconstrucción.

# ---------------------------------------------------------------------------
# Rules específicas del skill reverse
# ---------------------------------------------------------------------------
skill_rules:
  - rules_file: ~/.fremi/framework/reverse-engineering/reverse-feature/rules/stop-events.md
    scope: reverse-skill
    note: >
      Stop events específicos de este skill reverse: cuándo pausa para pedir
      input (Regla 27 — iniciativa del producto, métricas de éxito, ADRs sin
      rationale, capacidades transversales detectadas), abortar (Regla 25),
      o sugerir sync-back a la capa producto (Regla 12).

# ---------------------------------------------------------------------------
# Rules cross-domain siempre activas
# ---------------------------------------------------------------------------
transversal:
  - rules_file: ~/.fremi/framework/reverse-engineering/rules/reverse.md
    rules: [R25, R26, R27, R28, R29, R30, R31, R32]
    scope: global
    note: >
      Régimen completo de reverse. R26 (transparent default), R27 (preguntas
      dirigidas para gaps — iniciativa del producto, stories ambiguas, conflictos
      entre stories), R28 (no reemplaza revisión humana), R30 (R17 sí aplica
      con timestamps inferidos).

  - rules_file: ~/.fremi/framework/rules/framework-mechanics.md
    rules: [R24]
    scope: global
    note: R24 — framework debe estar instalado antes de correr reverse.

  - rules_file: ~/.fremi/framework/rules/versioning.md
    rules: [R17]
    scope: global
    note: >
      R17 aplica en reverse (R30). Frontmatter con timestamps inferidos del
      git history + parent bump obligatorio al firmar. Al reconstruir feature,
      bumpear product/plan.md (MINOR — nueva feature registrada) si la capa
      producto existe.

  - rules_file: ~/.fremi/framework/artifacts/story/rules/adr.md
    rules: [R3, R3b, R20]
    scope: global
    note: >
      ADRs reconstruidos del scope feature deben respetar R3/R3b/R20.
      Motivación de ADR es gap no-inferible → pausa (R27).
      Si la decisión trasciende la feature → promover a product scope (R20).

  - rules_file: ~/.fremi/framework/rules/sync-back.md
    rules: [R12]
    scope: global
    note: >
      R12 activo durante la reconstrucción de feature/definition.md. Si se
      detectan capacidades transversales → pausar y sugerir sync-back a
      producto (Regla 12). Si la capa producto no existe → sugerir correr
      /fremi-pipeline-reverse-product primero.

references:
  artifact_applies: ~/.fremi/framework/artifacts/feature/rules/applies.yaml
  reverse_rules: ~/.fremi/framework/reverse-engineering/rules/reverse.md
  reverse_config: ~/.fremi/framework/settings/config.reverse.core.yaml
  reverse_flow: ~/.fremi/framework/reverse-engineering/flow.md
  skill_doc: ~/.fremi/framework/reverse-engineering/reverse-feature/SKILL.md
