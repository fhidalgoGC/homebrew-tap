schema: framework-pipeline-rules-applies
schema_version: 1
pipeline: reverse-product
since: 2026-08-11
mode: reverse

# ===========================================================================
# APPLIES — reglas que el pipeline reverse-product enforcea durante su ejecución.
#
# Este archivo NO contiene texto de reglas — sólo POINTERS.
# ===========================================================================

# ---------------------------------------------------------------------------
# Rules del artifact orquestado (heredadas)
# ---------------------------------------------------------------------------
inherits:
  artifact_applies: ~/.fremi/framework/artifacts/product/rules/applies.yaml
  note: >
    El pipeline reverse invoca skills que RECONSTRUYEN docs del artifact product.
    Las reglas del artifact aplican al RESULTADO — pero se completan con
    reverse-specific rules (R25-R32) que gobiernan la reconstrucción.

# ---------------------------------------------------------------------------
# Rules específicas del pipeline reverse
# ---------------------------------------------------------------------------
pipeline_rules:
  - rules_file: ~/.fremi/framework/pipelines/reverse-product/rules/stop-events.md
    scope: pipeline
    note: >
      Stop events reverse: cuándo pausa para pedir input (Regla 27 — gaps
      no-inferibles), abortar (Regla 25 precondiciones), o marcar limitación
      (Regla 29 — R8 inconstruible). Incluye advertencia obligatoria de riesgo
      alto (racionalización post-hoc) antes de arrancar.

# ---------------------------------------------------------------------------
# Rules cross-domain siempre activas
# ---------------------------------------------------------------------------
transversal:
  - rules_file: ~/.fremi/framework/reverse-engineering/rules/reverse.md
    rules: [R25, R26, R27, R28, R29, R30, R31, R32]
    scope: global
    note: >
      Régimen completo de reverse. R26 (transparent default), R27 (preguntas
      dirigidas para gaps — especialmente rationale de iniciativas y planteamiento),
      R28 (no reemplaza revisión humana — revisión profunda obligatoria para producto),
      R30 (R17 sí aplica con timestamps inferidos del git history).

  - rules_file: ~/.fremi/framework/rules/framework-mechanics.md
    rules: [R24]
    scope: global
    note: R24 — framework debe estar instalado antes de correr reverse.

  - rules_file: ~/.fremi/framework/rules/versioning.md
    rules: [R17]
    scope: global
    note: >
      R17 aplica en reverse (R30). Frontmatter con timestamps inferidos del
      git history + parent bump obligatorio al firmar. Para producto (capa raíz)
      no hay padre externo que bumpear — los docs living de producto se versionan
      entre sí (plan.md bumpea cuando la feature lista arranca).

  - rules_file: ~/.fremi/framework/artifacts/story/rules/adr.md
    rules: [R3, R3b, R20]
    scope: global
    note: >
      ADRs retroactivos globales reconstruidos deben respetar R3/R3b/R20.
      Motivación de ADR es gap no-inferible → pausa (R27) para pedir contexto
      al usuario. Bifurcaciones estratégicas (elección de stack) → ADR con
      discovered_during_reverse: true.

references:
  artifact_workflow: ~/.fremi/framework/artifacts/product/workflow.yaml
  artifact_applies: ~/.fremi/framework/artifacts/product/rules/applies.yaml
  reverse_rules: ~/.fremi/framework/reverse-engineering/rules/reverse.md
  reverse_config: ~/.fremi/framework/settings/config.reverse.core.yaml
  reverse_flow: ~/.fremi/framework/reverse-engineering/flow.md
  pipeline_doc: ~/.fremi/framework/pipelines/reverse-product/PIPELINE.md
