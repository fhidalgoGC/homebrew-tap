schema: framework-pipeline-core
schema_version: 1
name: fremi-pipeline-product
layer: product
since: 2026-08-07

# ===========================================================================
# CONFIG.CORE — pipeline PRODUCT
#
# Fuente de verdad ESTRUCTURAL del pipeline. NO user-editable.
# Declara qué sub-skills invoca en qué orden y su modo default. La
# SECUENCIA REAL vive en ~/.fremi/framework/skills/product/config.core.yaml
# → step_matrix. Este archivo enumera los skills orquestados y su default
# mode; NO duplica la secuencia paso a paso.
# ===========================================================================

# Sub-skills orquestados, en el orden canónico declarado en el
# step_matrix de la capa (product).
invokes:
  - /fremi-product-iniciativas
  - /fremi-product-ideas
  - /fremi-product-planteamiento
  - /fremi-product-definition
  - /fremi-product-strategies
  - /fremi-product-plan

# Modo default para este pipeline. Overridable en config.user.yaml.
default_mode: auto

# Fuente de la secuencia paso a paso. No la duplicamos acá — el pipeline
# LA LEE de este archivo al ejecutarse. Si el step_matrix cambia, el
# pipeline se adapta automáticamente.
sequence_source: ~/.fremi/framework/skills/product/config.core.yaml → step_matrix

# Archivo doc.
doc: ~/.fremi/framework/pipelines/product/PIPELINE.md
